<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VODA Prime</title>
<meta name="description" content="VODA Prime: truck maintenance, checklists and the team leaderboard for VODA Cleaning &amp; Restoration.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VODA Prime">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121a23" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root {
  /* Layout: sticky top bar; summary tiles that filter; toolbar; a responsive grid of truck tiles (inline entry);
     an attention sidebar on wide screens; a details panel that slides in from the right. */
  --bg: #eef1f5;
  --surface: #ffffff;
  --surface-2: #f6f8fa;
  --ink: #111a24;
  --muted: #5a6879;
  --line: #e0e6ed;
  --accent: #1f4fbf;
  --accent-ink: #ffffff;
  --accent-soft: #e7eefc;
  --clean: #0f766e;
  --clean-bg: #dcf3ef;
  --ok: #17803d;
  --ok-bg: #e2f3e7;
  --soon: #985a05;
  --soon-bg: #fcefd3;
  --due: #c0281a;
  --due-bg: #fde6e3;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 2px 10px rgba(16, 24, 40, .06);
  --radius: 14px;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1117; --surface: #151d27; --surface-2: #19222d; --ink: #e7ecf2; --muted: #9babbc; --line: #273241;
    --accent: #7ea6ff; --accent-ink: #0b1320; --accent-soft: #1b2a45; --clean: #4fd1c0; --clean-bg: #12302c;
    --ok: #55c57f; --ok-bg: #12301f; --soon: #f0b54d; --soon-bg: #372a10; --due: #ff8072; --due-bg: #3d1814;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1117; --surface: #151d27; --surface-2: #19222d; --ink: #e7ecf2; --muted: #9babbc; --line: #273241;
  --accent: #7ea6ff; --accent-ink: #0b1320; --accent-soft: #1b2a45; --clean: #4fd1c0; --clean-bg: #12302c;
  --ok: #55c57f; --ok-bg: #12301f; --soon: #f0b54d; --soon-bg: #372a10; --due: #ff8072; --due-bg: #3d1814;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.4; -webkit-text-size-adjust: 100%; }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }

/* ---- top bar ---- */
.topbar {
  position: sticky; top: 0; z-index: 30; display: flex; align-items: center; flex-wrap: wrap; gap: 10px 18px;
  padding: 10px 24px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand svg { width: 30px; height: 30px; flex: none; }
.brand h1 { font-family: var(--font-display); font-size: 1.45rem; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; }
.sync { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: .88rem; font-variant-numeric: tabular-nums; }
.sync.offline { color: var(--soon); font-weight: 600; }
.sync.saving { color: var(--accent); font-weight: 600; }
.kpi.tmchk::after { background: var(--soon); }
.kpi.tmchk .num { color: var(--soon); }
.kpi.tmchk.missed::after { background: var(--due); }
.kpi.tmchk.missed .num { color: var(--due); }
.kpi.tmchk.clear::after { background: var(--ok); }
.kpi.tmchk.clear .num { color: var(--ok); }
.flag.ok { background: var(--ok-bg); color: var(--ok); }
.flag.skip { background: var(--line); color: var(--muted); }
.tile-chk { margin: 0; padding: 0 14px 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .8rem; }
.tile-chk:empty { display: none; }
.stale { margin: 2px 0 0; font-size: .76rem; color: var(--muted); font-style: italic; }
.tmcheck { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-top: 12px; padding: 10px 14px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--soon); }
.tmcheck[hidden] { display: none; }
.tmcheck.due { border-left-color: var(--due); }
.tmcheck.ok { border-left-color: var(--ok); }
.tc-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.tc-count { color: var(--muted); font-size: .88rem; font-variant-numeric: tabular-nums; }
.tc-left { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.tc-lbl { font-size: .82rem; font-weight: 700; color: var(--muted); }
.tc-truck { font: inherit; font-size: .8rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; border: 0; cursor: pointer; }
.tc-truck.due { background: var(--due-bg); color: var(--due); }
.tc-truck.soon { background: var(--soon-bg); color: var(--soon); }
.tc-done { color: var(--ok); font-weight: 700; font-size: .9rem; }
.tc-hint { flex-basis: 100%; margin: 0; font-size: .82rem; color: var(--muted); }
.tc-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: .88rem; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; }
.gps-warn { all: unset; cursor: pointer; font-weight: 700; font-size: .82rem; color: var(--soon); background: var(--soon-bg); padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.gps-warn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.top-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600; font-size: .92rem;
  padding: 8px 13px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; white-space: nowrap;
}
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); }
.btn.danger { color: var(--due); }
.btn.small { padding: 6px 10px; font-size: .85rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn svg, .icon-btn svg { width: 17px; height: 17px; flex: none; }
.icon-btn { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; color: var(--ink); }
.icon-btn:hover { border-color: var(--accent); }
.btn:focus-visible, .icon-btn:focus-visible, .kpi:focus-visible, .tile-head:focus-visible, .chip-btn:focus-visible, .attn-btn:focus-visible, summary:focus-visible {
  outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px;
}
.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---- page ---- */
.page { padding: 18px 24px 48px; display: grid; gap: 16px; }
.banner { border-radius: 12px; padding: 11px 14px; font-weight: 500; background: var(--soon-bg); border: 1px solid var(--line); }
.banner:empty { display: none; }
.installbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; background: var(--surface); border: 1.5px solid var(--accent); border-radius: 12px; padding: 10px 14px; }
.installbar p { margin: 0; flex: 1 1 240px; }

.kpis { display: grid; grid-template-columns: repeat(var(--kpis, 5), minmax(0, 1fr)); gap: 12px; }
.kpi {
  text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 12px 16px; display: grid; gap: 2px; align-content: start; cursor: pointer; position: relative; overflow: hidden;
}
.kpi::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--line); }
.kpi.due::after { background: var(--due); }
.kpi.soon::after { background: var(--soon); }
.kpi.ok::after { background: var(--ok); }
.kpi.paper::after { background: var(--muted); }
.kpi.all::after { background: var(--accent); }
.kpi.engine::after { background: var(--due); }
.kpi.doc.due::after { background: var(--due); }
.kpi.doc.due .num { color: var(--due); }
.kpi.doc.soon::after { background: var(--soon); }
.kpi.doc.soon .num { color: var(--soon); }
.kpi.doc.clear::after { background: var(--ok); }
.kpi.doc.clear .num { color: var(--ok); }
.kpi.engine .num { color: var(--due); }
.kpi .num { font-family: var(--font-display); font-size: 2.1rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi.due .num { color: var(--due); }
.kpi.soon .num { color: var(--soon); }
.kpi.ok .num { color: var(--ok); }
.kpi .lbl { color: var(--muted); font-weight: 700; font-size: .76rem; text-transform: uppercase; letter-spacing: .06em; }
.kpi .lbl .short { display: none; }
@media (max-width: 1279px) { .kpi .lbl .long { display: none; } .kpi .lbl .short { display: inline; } }
.kpi[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent), var(--shadow); }

.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.search { position: relative; flex: 1 1 260px; max-width: 420px; }
.search svg { position: absolute; left: 11px; top: 50%; width: 17px; height: 17px; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search input { width: 100%; font: inherit; padding: 9px 12px 9px 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.chip-btn { padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: .88rem; cursor: pointer; }
.chip-btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.sortsel { font: inherit; font-weight: 600; font-size: .88rem; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.toolbar .count { color: var(--muted); font-size: .88rem; margin-left: auto; font-variant-numeric: tabular-nums; }
.filt-btn { display: none; align-items: center; gap: 6px; white-space: nowrap; }
.filt-btn[aria-pressed="true"], .toolbar.open .filt-btn { border-color: var(--accent); color: var(--accent); }
.filt-btn .n { background: var(--accent); color: var(--accent-ink); border-radius: 999px; font-size: .72rem; padding: 0 6px; line-height: 1.5; }

.layout { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 1280px) {
  .layout { grid-template-columns: minmax(0, 1fr) 320px; }
  .aside { position: sticky; top: 74px; max-height: calc(100vh - 90px); overflow: auto; }
  .how-bottom { display: none; }
}
@media (max-width: 1279px) { .aside { display: none; } }

/* ---- truck tiles ---- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(275px, 1fr)); gap: 14px; align-items: start; }
.tile {
  background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
  display: flex; flex-direction: column; overflow: hidden; position: relative; scroll-margin-top: 80px;
}
.tile::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--line); }
.tile[data-status="due"]::before { background: var(--due); }
.tile[data-status="soon"]::before { background: var(--soon); }
.tile[data-status="ok"]::before { background: var(--ok); }
.tile.flash { box-shadow: 0 0 0 3px var(--accent), var(--shadow); }
.tile { cursor: pointer; }
.tile input:not([readonly]) { cursor: text; }
.tile-head { all: unset; box-sizing: border-box; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; padding: 14px 14px 0; cursor: pointer; }
.tile-title { display: flex; align-items: center; gap: 6px 8px; flex-wrap: wrap; min-width: 0; }
.plate { font-weight: 700; font-size: .8rem; letter-spacing: .07em; padding: 1px 6px; border: 1.5px solid var(--muted); border-radius: 5px; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.div-chip { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.div-chip.cleaning { background: var(--clean-bg); color: var(--clean); }
.div-chip.restoration { background: var(--accent-soft); color: var(--accent); }
.div-chip.none { color: var(--muted); border: 1px dashed var(--line); }
#grid.split .tile-title .div-chip { display: none; }
.tile-foot .miles { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
.grp { grid-column: 1 / -1; display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; margin-top: 10px; padding: 0 2px 7px; border-bottom: 3px solid var(--line); }
.grp:first-child { margin-top: 0; }
.grp-name { font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; text-transform: uppercase; letter-spacing: .04em; line-height: 1.1; }
.grp.restoration { border-bottom-color: var(--accent); }
.grp.restoration .grp-name { color: var(--accent); }
.grp.cleaning { border-bottom-color: var(--clean); }
.grp.cleaning .grp-name { color: var(--clean); }
.grp.none .grp-name { color: var(--muted); }
.grp-count { color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }
.grp-stats { display: inline-flex; gap: 6px; }
.grp-stat { font-size: .74rem; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.grp-stat.due { background: var(--due-bg); color: var(--due); }
.grp-stat.soon { background: var(--soon-bg); color: var(--soon); }
.grp-stat.ok { background: var(--ok-bg); color: var(--ok); }
.grp-hint { color: var(--muted); font-size: .8rem; }
.unit { font-family: var(--font-display); font-weight: 700; font-size: 1.45rem; text-transform: uppercase; letter-spacing: .02em; line-height: 1.05; }
.driver { color: var(--muted); font-weight: 600; }
.tile-sub { margin: 3px 0 0; padding: 0 14px; color: var(--muted); font-size: .84rem; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tag { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); background: var(--accent-soft); padding: 2px 7px; border-radius: 6px; }
.pill { padding: 3px 10px; border-radius: 999px; font-weight: 700; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.pill.due { background: var(--due-bg); color: var(--due); }
.pill.soon { background: var(--soon-bg); color: var(--soon); }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.metrics { padding: 12px 14px; display: grid; gap: 10px; flex: 1; align-content: start; }
.metric { display: grid; gap: 4px; }
.metric-line { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.metric-label { font-size: .74rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.metric-value { font-weight: 700; font-variant-numeric: tabular-nums; }
.metric.due .metric-value { color: var(--due); }
.metric.soon .metric-value { color: var(--soon); }
.metric.ok .metric-value { color: var(--ok); }
.meter { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; }
.meter > span { display: block; height: 100%; background: var(--ok); border-radius: 3px; }
.metric.soon .meter > span, .drow.soon .meter > span { background: var(--soon); }
.metric.due .meter > span, .drow.due .meter > span { background: var(--due); }
.no-reading { margin: 0; color: var(--muted); }
.quick { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); background: var(--surface-2); align-items: end; }
.quick.no-tm { grid-template-columns: minmax(0, 1fr) auto; }
.qf label { display: block; font-size: .7rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 3px; }
.qf input, .df input {
  width: 100%; font: inherit; font-weight: 700; font-size: 1.05rem; padding: 7px 9px; border-radius: 9px; border: 1.5px solid var(--line);
  background: var(--surface); color: var(--ink); font-variant-numeric: tabular-nums;
}
.qf input:focus, .df input:focus, .field input:focus, .field select:focus, .field textarea:focus, .search input:focus {
  outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
}
.qf .gps { font-size: .66rem; color: var(--accent); margin-left: 4px; }
.qf input.locked, .df input.locked { background: transparent; border-style: dashed; color: var(--muted); }
.quick.view-only { grid-template-columns: minmax(0, 1fr); }
.user-row { display: grid; gap: 6px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.user-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.user-top strong { font-size: 1rem; }
.user-meta { color: var(--muted); font-size: .84rem; }
.user-acts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.user-acts select { font: inherit; font-size: .88rem; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.code-box { display: grid; gap: 8px; padding: 12px; border-radius: 10px; border: 1.5px solid var(--accent); background: var(--accent-soft); }
.code-box .code { font-family: var(--font-display); font-size: 1.8rem; font-weight: 700; letter-spacing: .08em; color: var(--ink); }
.warn { margin: 0; padding: 0 14px 8px; background: var(--surface-2); color: var(--soon); font-weight: 600; font-size: .82rem; }
.warn:empty { display: none; }
.tile-foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 8px; padding: 0 14px 10px; font-size: .8rem; color: var(--muted); background: var(--surface-2); }
.tile-foot .left { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
.paper-badge { font-weight: 700; color: var(--due); background: var(--due-bg); padding: 1px 7px; border-radius: 999px; }
.paper-badge.soon { color: var(--soon); background: var(--soon-bg); }
.link { all: unset; cursor: pointer; color: var(--accent); font-weight: 700; }
.link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
/* GPS line on a tile: alerts, then status · place · fuel */
.tile-gps { margin: 0; padding: 0 14px 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .8rem; color: var(--muted); }
.tile-gps:empty { display: none; }
.gps-txt { min-width: 0; flex: 1 1 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.flag { font-weight: 700; font-size: .72rem; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.flag.due { background: var(--due-bg); color: var(--due); }
.flag.soon { background: var(--soon-bg); color: var(--soon); }
/* A truck's own color: its name in that color and a stripe down the left edge. The tile stays white. */
.tile.colored::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--truck); pointer-events: none; }
.colored .unit { color: var(--truck-text); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .colored .unit { color: var(--truck-text-dark); } }
:root[data-theme="dark"] .colored .unit { color: var(--truck-text-dark); }
.empty-grid { grid-column: 1 / -1; background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); padding: 28px; text-align: center; color: var(--muted); }

/* ---- sidebar ---- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; display: grid; gap: 8px; }
.panel + .panel { margin-top: 14px; }
.panel h2 { font-family: var(--font-display); font-size: 1.15rem; text-transform: uppercase; letter-spacing: .04em; }
.attn-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.attn-btn { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 10px 1fr; gap: 2px 10px; width: 100%; padding: 7px 8px; border-radius: 8px; cursor: pointer; }
.attn-btn:hover { background: var(--surface-2); }
.attn-btn strong { font-weight: 700; }

.dr-head .unit { font-size: 1.4rem; }

.dr-edit { flex: none; gap: 5px; padding-inline: 10px; }

.shop-row { display: block; margin-top: 4px; color: var(--muted); }

.dr-body { padding: 16px 18px 28px; display: grid; gap: 14px; }
.dfields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }

.drow { display: grid; gap: 5px; padding: 11px 13px; border-radius: 11px; background: var(--surface-2); border: 1px solid var(--line); }

details.tasks summary { cursor: pointer; font-weight: 700; color: var(--accent); font-size: .9rem; }

/* service history */

/* color picker */

/* ---- forms and dialogs (log service, edit, settings) ---- */

/* ---- sign-in ---- */

  border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; font-size: .92rem; color: var(--ink); white-space: nowrap; }

.sup-box { grid-row: span 2; width: 24px; height: 24px; border-radius: 7px; border: 2px solid color-mix(in srgb, var(--muted) 70%, transparent); display: grid; place-items: center; color: #fff; }

.lb-boxes { display: grid; gap: 8px; grid-template-columns: repeat(2, minmax(0, 1fr)); }

.lb-box { display: grid; gap: 3px; min-width: 0; }

.lb-card-foot { margin: 0; font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }

.lb-grid { border-collapse: separate; border-spacing: 2px; font-size: .72rem; font-variant-numeric: tabular-nums; }

}
.lb-bar select { font: inherit; font-weight: 600; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; }

<script>
"use strict";
// <logic>
const SOON_MILES = 500;   // from the sheet: yellow when under 500 mi left
const SOON_HRS = 20;      // from the sheet: yellow within 20 TM hrs of the next service
const COMBINE_HRS = 20;   // services due within 20 hrs of each other are done together
const DEFAULT_CDS_MILES_PER_HR = 15;

const PROGRAMS = {
  cds: { name: "CDS 4.6 / 4.8", selfPowered: false, tiers: [
    { h: 100, oil: "truck", tasks: [
      "Engine oil – change",
      "Engine air cleaner – inspect",
      "Battery terminals – clean as needed" ] },
    { h: 400, tasks: [
      "Blower oil – change",
      "Pump oil – change",
      "Vehicle fuel lines – check for chafing or wear",
      "CDS wiring harness – check for chafing or wear",
      "Vehicle wiring harness – check for chafing or wear",
      "CDS fasteners – check blower, drive shaft, front end",
      "Drive shaft – grease spline (if so equipped)",
      "Bearings / power pack pillow block – grease",
      "Chemical pump – inspect",
      "Chemical pump diaphragm – check for wear",
      "Chemical pump valves – check for wear",
      "Water box float valve – remove stem and lubricate" ] },
    { h: 1000, tasks: [
      "Vehicle – complete service",
      "Cooling system – flush",
      "Transmission fluid – change",
      "Drive shaft – grease U-joints and splines" ] } ] },
  legend: { name: "Legend GT", selfPowered: true, tiers: [
    { h: 100, tasks: [
      "Vacuum relief valve – check, adjust up to 13″ Hg if needed",
      "O-rings – lubricate (o-ring lubricant only, Legend Brands P/N 13-003)",
      "Belts – check for wear, re-tension, check pulley alignment",
      "Battery terminals – clean",
      "Spark plugs – check (OEM only)",
      "Engine oil and filter – change" ] },
    { h: 500, tasks: [
      "Water pump – change crankcase oil",
      "Engine – replace in-line fuel filter",
      "Pulleys and hubs – check for proper torque",
      "Chemical pump – change diaphragm and check valves, inspect disc",
      "Vacuum pump – grease bearings on pulley end" ] },
    { h: 1000, tasks: [
      "Spark plugs – replace (OEM only)",
      "Engine air filter element – replace" ] },
    { h: 2000, tasks: [
      "All belts – replace",
      "Vacuum pump – drain, flush and replace gear end oil" ] } ] },
  apex: { name: "Apex 570", selfPowered: true, tiers: [
    { h: 100, tasks: [
      "Vacuum relief valve – check, adjust up to 13″ Hg if needed",
      "Pressure regulator – lubricate o-rings (Sapphire Scientific P/N 13-003)",
      "Belts – re-tension all belts",
      "Battery terminals – clean",
      "Spark plugs – check (OEM only)" ] },
    // Sapphire's Apex 570 manual (Rev M): engine oil and filter every 200 hrs, never longer. Until a 200-hr service is
    // logged, the last 100-hr service counts as the last oil change (it used to include one).
    { h: 200, since: 100, tasks: [
      "Engine oil and filter – change (OEM filter only)",
      "Engine air filter – check" ] },
    { h: 500, tasks: [
      "Pressure pump – change crankcase oil",
      "Engine – replace in-line fuel filter",
      "Pulleys and hubs – check for proper torque",
      "Chemical pump – change diaphragm and check valves, inspect disc" ] },
    { h: 1000, tasks: [
      "Vacuum pump – drain, flush and replace oil",
      "Spark plugs – replace (OEM only)",
      "Engine air filter element – replace",
      "Engine valves – adjust to .0057–.0073 in." ] },
    { h: 2000, tasks: [
      "All belts – replace" ] } ] }
};

const RANK = { ok: 0, soon: 1, due: 2 };
const isNum = v => typeof v === "number" && Number.isFinite(v);
const stMiles = left => left <= 0 ? "due" : left < SOON_MILES ? "soon" : "ok";
const stHrs = left => left <= 0 ? "due" : left <= SOON_HRS ? "soon" : "ok";
const worstOf = list => list.reduce((w, s) => RANK[s] > RANK[w] ? s : w, "ok");

/** When a service was last done: saved hrs, or (for a newly added service) the one it used to be part of, or the last round number. */
function lastDone(t, tr, hrs) {
  const saved = t.tiers ? t.tiers[String(tr.h)] : undefined;
  if (isNum(saved)) return saved;
  const before = tr.since && t.tiers ? t.tiers[String(tr.since)] : undefined;
  return isNum(before) ? before : Math.floor(hrs / tr.h) * tr.h;
}
/** The services a logged service counts for at those hrs: itself, the smaller ones that fit into it, and any already due. */
function servicesCovered(t, level, hrs) {
  const prog = PROGRAMS[t.tm];
  if (!prog || !level) return [];
  return prog.tiers.filter(tr => tr.h === level ||
    (tr.h < level && (level % tr.h === 0 || (isNum(hrs) && lastDone(t, tr, hrs) + tr.h <= hrs + COMBINE_HRS)))).map(tr => tr.h);
}

function compute(t, miles, hrs) {
  const r = { oil: null, service: null, worst: "ok", empty: true };
  const prog = PROGRAMS[t.tm] || null;

  if (isNum(miles) && isNum(t.milesAtOil) && isNum(t.oilInterval)) {
    const driven = miles - t.milesAtOil;
    let tmHrs = null, tmMiles = 0;
    const factor = isNum(t.cdsMilesPerHr) ? t.cdsMilesPerHr : DEFAULT_CDS_MILES_PER_HR;
    if (t.tm === "cds" && isNum(hrs) && isNum(t.hrsAtOil)) {
      tmHrs = hrs - t.hrsAtOil;
      tmMiles = tmHrs * factor;
    }
    const used = driven + tmMiles;
    const left = t.oilInterval - used;

  if (!isColor(hex)) return "";
  return `--truck:${hex};--truck-text:${readableOn(hex, "#ffffff")};--truck-text-dark:${readableOn(hex, "#151d27")}`;
}
/** Swatches + "custom" color input. The chosen value sits in a hidden input with this id. */
function colorPicker(id, value, onpick) {
  value = isColor(value) ? value.toLowerCase() : "";
  const hidden = h("input", { type: "hidden", id, value });
  const wrap = h("div", { class: "swatches", role: "radiogroup", "aria-label": "Truck color" });
  const custom = h("input", { type: "color", "aria-label": "Custom color", value: value || "#2563eb" });
  const more = h("label", { class: "sw-more sw", title: "Custom color" }, custom, h("span", { text: "+", "aria-hidden": "true" }));
  const set = v => {
    hidden.value = v;
    for (const b of wrap.querySelectorAll("button.sw")) b.setAttribute("aria-checked", String(b.dataset.c === v));
    const isCustom = !!v && !PALETTE.some(p => p[1] === v);
    more.classList.toggle("on", isCustom);
    more.style.background = isCustom ? v : "";
    if (onpick) onpick(v);
  };
  const sw = (name, c) => h("button", { type: "button", class: "sw" + (c ? "" : " none"), role: "radio", "data-c": c, "aria-label": name, title: name,
    "aria-checked": String(value === c), style: c ? `background:${c}` : null, onclick: () => set(c) });
  custom.addEventListener("input", () => set(custom.value.toLowerCase()));
  wrap.append(sw("No color", ""), ...PALETTE.map(([n, c]) => sw(n, c)), more);
  if (value && !PALETTE.some(p => p[1] === value)) { more.classList.add("on"); more.style.background = value; }
  return h("div", { class: "field" }, h("label", { text: "Truck color" }), wrap, hidden,
    h("span", { class: "hint", text: "Shows on the truck's name and down the edge of its tile. Tap Save to keep it." }));
}

/* ---------- rendering ---------- */
function evalTruck(t) {
  const v = currentValues(t);
  const r = compute(t, safeNum(v.miles), safeNum(v.hrs));
  const pw = paperwork(t, today);
  return { v, r, pw, pwBad: pw.filter(p => p.status !== "ok") };
}
function urgency(r) {
  const parts = [];
  if (r.oil) parts.push(r.oil.left / Math.max(1, r.oil.interval));
  if (r.service) parts.push(r.service.left / 100);
  return parts.length ? Math.min(...parts) : 9;
}
function visibleTrucks() {
  const q = view.q.trim().toLowerCase();
  let list = scoped().map(t => ({ t, e: evalTruck(t) }));
  if (q) list = list.filter(x => [x.t.unit, x.t.driver, x.t.vehicle, x.t.plate, x.t.year, x.t.division, x.t.vin].join(" ").toLowerCase().includes(q));
  if (view.tmOnly) list = list.filter(x => progOf(x.t));
  if (view.filter === "due" || view.filter === "soon" || view.filter === "ok") list = list.filter(x => !x.e.r.empty && x.e.r.worst === view.filter);
  if (view.filter === "paper") list = list.filter(x => x.e.pwBad.length);
  for (const [key, lbl] of PAPER_KPIS) if (view.filter === key) list = list.filter(x => x.e.pw.some(p => p.label === lbl && p.status !== "ok"));
  if (view.filter === "engine") list = list.filter(x => x.t.gps && x.t.gps.check === "on");
  if (view.filter === "tmcheck") list = list.filter(x => checkDue(x.t));
  if (view.sort === "urgent") list.sort(byUrgency);
  return list;
}
/** Most urgent first: the worse of maintenance status and GPS alerts, then how close the next job is. */
const effRank = x => Math.max(RANK[x.e.r.worst] || 0, alertRank(x.t));
const byUrgency = (a, b) => (effRank(b) - effRank(a)) || (RANK[b.e.r.worst] - RANK[a.e.r.worst]) || (urgency(a.e.r) - urgency(b.e.r)) || ((a.t.order ?? 99) - (b.t.order ?? 99));
const gpsOn = () => !!gpsHealth || trucks.some(t => t.gps);

function renderAll() {
  if (!session) return;
  const focused = document.activeElement && document.activeElement.id;
  const caret = (() => { try { return document.activeElement.selectionStart; } catch (e) { return null; } })();
  renderKpis();
  renderCheck();
  renderGrid();
  renderAside();
  renderSupplies();
  if (openId && drawer.open) renderDrawer(openId);
  if (focused) {
    const el = $(focused);
    if (el && el !== document.activeElement) { el.focus(); try { if (caret != null) el.setSelectionRange(caret, caret); } catch (e) {} }
  }
}

/** Summary boxes for one kind of paperwork each: past due or due within 30 days. */
const PAPER_KPIS = [["insp", "Safety inspection"], ["reg", "Registration"]];
function renderKpis() {
  if (!loaded) { $("kpis").replaceChildren(); return; }
  let nDue = 0, nSoon = 0, nEngine = 0, nTm = 0, tmMissed = false;
  const doc = { insp: { due: 0, soon: 0 }, reg: { due: 0, soon: 0 } };
  const inUnit = scoped();
  for (const t of inUnit) {
    const e = evalTruck(t);
    if (!e.r.empty) { if (e.r.worst === "due") nDue++; else if (e.r.worst === "soon") nSoon++; }
    for (const [key, lbl] of PAPER_KPIS) { const p = e.pw.find(x => x.label === lbl); if (p && p.status !== "ok") doc[key][p.status]++; }
    if (t.gps && t.gps.check === "on") nEngine++;
    const c = tmCheck(t);
    if (c && (c.state === "today" || c.state === "missed")) { nTm++; if (c.state === "missed" || c.weeks >= 1 || !c.last) tmMissed = true; }
  }
  const showEngine = gpsOn();
  const showTm = apiLevel >= 10 && trucks.some(t => progOf(t));
  if (!showEngine && view.filter === "engine") view.filter = "all";
  if (!showTm && view.filter === "tmcheck") view.filter = "all";
  if (view.filter === "ok" || view.filter === "paper") view.filter = "all";   // those boxes are gone
  const extra = (showEngine ? 1 : 0) + (showTm ? 1 : 0);
  $("kpis").style.setProperty("--kpis", 5 + extra);
  $("kpis").style.setProperty("--kpis-phone", 3);   // phones: rows of three (All trucks is hidden there)
  const docKpi = (key, lbl, short) => {
    const d = doc[key], n = d.due + d.soon;
    const el = kpi(key, "doc " + (d.due ? "due" : n ? "soon" : "clear"), n, lbl, short);
    el.title = n ? [d.due ? `${d.due} past due` : "", d.soon ? `${d.soon} due within 30 days` : ""].filter(Boolean).join(", ") : "Nothing due within 30 days";
    return el;
  };
  const kpi = (key, cls, num, lbl, short) => h("button", { class: "kpi " + cls, type: "button", "aria-pressed": String(view.filter === key),
    onclick: () => { view.filter = view.filter === key && key !== "all" ? "all" : key; saveView(); renderAll(); } },
    h("span", { class: "num", text: String(num) }),
    h("span", { class: "lbl" }, h("span", { class: "long", text: lbl }), h("span", { class: "short", text: short || lbl })));
  $("kpis").replaceChildren(...[
    kpi("all", "all", inUnit.length, view.division ? `All ${view.division}` : "All trucks"),
    kpi("due", "due", nDue, "Service overdue"),
    kpi("soon", "soon", nSoon, "Service due soon"),
    docKpi("insp", "Safety inspection", "Safety inspection"),
    docKpi("reg", "Registration", "Registration"),
    showEngine ? kpi("engine", "engine", nEngine, "Check engine", "Engine") : null,
    showTm ? kpi("tmcheck", "tmchk" + (tmMissed ? " missed" : nTm ? "" : " clear"), nTm, "TM hrs not checked", "TM hrs") : null].filter(Boolean));
}

/** The week's TM hrs checklist: shown on Tuesdays, and on other days while any truck was missed. */
function renderCheck() {
  const box = $("tmcheck");
  const list = loaded ? scoped().map(t => ({ t, c: tmCheck(t) })).filter(x => x.c) : [];
  const now = clockNow(), isTue = now.getDay() === CHECK_DAY;
  const left = list.filter(x => x.c.state === "today" || x.c.state === "missed");
  if (!list.length || (!isTue && !left.length)) { box.hidden = true; box.replaceChildren(); return; }
  const done = list.filter(x => x.c.state === "done").length, skipped = list.filter(x => x.c.state === "skipped").length;
  const late = x => x.c.state === "missed" || x.c.weeks >= 1 || !x.c.last;
  const start = list[0].c.start;
  box.hidden = false;
  box.className = "tmcheck " + (!left.length ? "ok" : left.some(late) ? "due" : "soon");
  box.replaceChildren(...[
    h("div", { class: "tc-head" },
      h("strong", { text: isTue ? "Today's TM hrs check" : `TM hrs check · Tue ${shortDate(start)}` }),
      h("span", { class: "tc-count", id: "tcCount", text: `${done} of ${list.length} done${skipped ? ` · ${skipped} not available` : ""}` })),
    left.length
      ? h("div", { class: "tc-left" },
          h("span", { class: "tc-lbl", text: isTue ? "Still to do:" : "Missed:" }),
          left.map(x => h("button", { class: "tc-truck " + (late(x) ? "due" : "soon"), type: "button", onclick: () => openDetails(x.t.id),
            title: x.c.last ? `TM hrs last entered ${fmtWhen(x.c.last.toISOString())}` : "No TM hrs entered in the app yet", text: x.t.unit || label(x.t) })))
      : h("span", { class: "tc-done", text: "All done ✓" }),
    !isAdmin() && left.length ? h("p", { class: "tc-hint", text: "Type the TM hrs on each truck and tap Save, or tap Confirm if they haven't changed. Truck not here? Open it and tap Not available this week." }) : null].filter(Boolean));
}

const GROUPS = [["Restoration", "restoration"], ["Cleaning", "cleaning"], ["", "none"]];
const groupOf = t => DIVISIONS.includes(t.division) ? t.division : "";
/** Each department heading shows how many of its trucks are overdue or due soon (kept current while typing). */
function updateGroupHeads() {
  const heads = document.querySelectorAll("#grid .grp");
  if (!heads.length) return;
  const list = visibleTrucks();
  for (const el of heads) {
    const items = list.filter(x => groupOf(x.t) === el.dataset.group && !x.e.r.empty);
    const due = items.filter(x => x.e.r.worst === "due").length, soon = items.filter(x => x.e.r.worst === "soon").length;
    el.querySelector(".grp-stats").replaceChildren(...[
      due ? h("span", { class: "grp-stat due", text: `${due} overdue` }) : null,
      soon ? h("span", { class: "grp-stat soon", text: `${soon} due soon` }) : null,
      !due && !soon && items.length ? h("span", { class: "grp-stat ok", text: "All OK" }) : null].filter(Boolean));
  }
}
function renderGrid() {
  const grid = $("grid");
  if (!loaded) { grid.replaceChildren(h("p", { class: "loading", text: "Loading fleet…" })); return; }
  const list = visibleTrucks();
  // One section per department (Restoration, then Cleaning, then trucks with no unit), each in the chosen order.
  const groups = GROUPS.map(([name, cls]) => ({ name, cls, items: list.filter(x => groupOf(x.t) === name) })).filter(g => g.items.length);
  const split = groups.length > 1;
  const kids = [];
  for (const g of groups) {
    if (split) kids.push(h("div", { class: "grp " + g.cls, id: "grp-" + g.cls, "data-group": g.name, role: "heading", "aria-level": "2" },
      h("span", { class: "grp-name", text: g.name || "No unit" }),
      h("span", { class: "grp-count", text: `${g.items.length} truck${g.items.length === 1 ? "" : "s"}` }),
      h("span", { class: "grp-stats" }),
      g.name ? null : h("span", { class: "grp-hint", text: "Set the unit with Edit in the truck's details" })));
    kids.push(...g.items.map(x => tileEl(x.t)));
  }
  grid.replaceChildren(...kids);
  grid.classList.toggle("split", split);   // the heading names the department, so the tiles don't repeat it
  if (!list.length) {
    grid.append(h("div", { class: "empty-grid" },
      trucks.length ? "No trucks match. " : "No trucks yet. ",
      trucks.length ? h("button", { class: "link", type: "button", text: "Show all trucks", onclick: () => { view.filter = "all"; view.q = ""; view.tmOnly = false; view.division = ""; $("q").value = ""; $("divSel").value = ""; $("tmOnly").setAttribute("aria-pressed", "false"); saveView(); renderAll(); } })
                    : h("button", { class: "link", type: "button", text: "Add truck", onclick: () => openEdit(null) })));
  }
  for (const x of list) updateTile(x.t.id);
  updateGroupHeads();
  $("countText").textContent = `${list.length} of ${scoped().length} trucks${view.division ? " · " + view.division : ""}`;
  renderFiltBtn();
}

/** Miles on this truck come from One Step GPS, so the tile shows them instead of a box to type in. */
const gpsMiles = t => !!(t.gps && t.gps.syncing) || t.readingBy === "GPS";
function tileEl(t) {
  const prog = progOf(t);
  const v = currentValues(t);
  const milesBox = isAdmin() && !gpsMiles(t);   // miles typed by hand on this truck
  const quick = milesBox || !!prog;
  const sub = subLine(t);
  const theme = truckTheme(t.color);

      const gone = pendingFor(job.key).some(j => j.action === "deleteService");

  body.readingAt = new Date().toISOString();
  body.readingBy = session ? session.name : "";
  if (prog && isNum(v.hrs) && (v.hrs !== t.hrsNow || st.confirm)) { body.hrsAt = body.readingAt; body.hrsBy = body.readingBy; }   // counts for the Tuesday check
  const restore = { miles: v.milesStr, hrs: v.hrsStr };
  delete drafts[id]; saveDrafts();
  const log = { kind: "reading", miles: body.milesNow, hrs: prog && isNum(v.hrs) ? v.hrs : null, items: st.confirm ? ["TM hrs confirmed (no change)"] : [] };
  if (st.confirm) log.hrsChecked = true;
  try { saveTruck(t, body, log, st.confirm ? `TM hrs confirmed for ${label(t)}` : `Saved ${label(t)}`, restore); }
  catch (e) { drafts[id] = restore; saveDrafts(); toast(failText(e, "Your numbers")); }
  renderAll();
}

function openService(id) {
  const t = byId(id); if (!t) return;
  const prog = progOf(t);
  const v = currentValues(t);
  const r = compute(t, safeNum(v.miles), safeNum(v.hrs));
  const err = h("p", { class: "dlg-err", role: "alert" });

  const truckOil = h("input", { type: "checkbox", id: "sv-oil", checked: !!(r.oil && r.oil.status !== "ok") });
  const preLevel = r.service && r.service.status !== "ok" ? r.service.level : 0;
  const chosenLevel = () => Number((dlg.querySelector('input[name="sv-level"]:checked') || {}).value || 0);
  const syncOil = () => {
    const chosen = chosenLevel();
    if (!prog || !chosen) return;
    const covered = servicesCovered(t, chosen, parseNum(val("sv-hrs")));
    const includesOil = prog.tiers.filter(x => covered.includes(x.h)).map(x => x.oil).filter(Boolean);
    if (includesOil.includes("truck")) truckOil.checked = true;
  };
  const tierRadios = prog ? h("fieldset", null,
    h("legend", { text: "TM service done" }),
    h("label", { class: "check" }, h("input", { type: "radio", name: "sv-level", value: "0", checked: preLevel === 0, onchange: syncOil }), h("span", { text: "None" })),
    prog.tiers.map((x, i) => h("label", { class: "check" },
      h("input", { type: "radio", name: "sv-level", value: String(x.h), checked: preLevel === x.h, onchange: syncOil }),
      h("span", null, `${x.h}-hr service`, (() => {
        const inc = prog.tiers.filter(y => y.h < x.h && x.h % y.h === 0).map(y => y.h + "-hr");
        return inc.length ? h("small", { text: `Includes the ${inc.length > 1 ? inc.slice(0, -1).join(", ") + " and " + inc[inc.length - 1] : inc[0]} items` }) : null;
      })())))) : null;

  openDialog(
    h("h3", { id: "dlgTitle", text: `Log oil change / service · ${label(t)}` }),
    h("p", { text: "Tick what was done. The countdowns restart from the miles and hours below." }),
    h("div", { class: "grid2" },
      numField("Miles at service", "sv-miles", isNum(v.miles) ? v.miles : t.milesNow),
      prog ? numField("TM hrs at service", "sv-hrs", isNum(v.hrs) ? v.hrs : t.hrsNow, null, "decimal") : null),
    h("fieldset", null,
      h("legend", { text: "Oil" }),
      h("label", { class: "check" }, truckOil, h("span", null, "Truck oil changed", h("small", { text: `Restarts the ${fmt(t.oilInterval)} mi countdown${t.tm === "cds" ? " (miles and TM hrs)" : ""}` })))),
    tierRadios,
    h("div", { class: "grid2" },
      shopField("sv-shop", ""),
      numField("Cost $ (optional)", "sv-cost", null, null, "decimal")),
    h("div", { class: "field" }, h("label", { for: "sv-note", text: "Note (optional)" }), h("textarea", { id: "sv-note", rows: "2", placeholder: "Anything else worth knowing" })),
    h("p", { class: "hint", text: "This is also added to the truck's service history." }),
    err,
    h("div", { class: "dlg-foot" },
      h("div", { class: "right" },
        h("button", { class: "btn", type: "button", onclick: closeDialog, text: "Cancel" }),
        h("button", { class: "btn primary", type: "button", id: "sv-save", text: "Save", onclick: async () => {
          const miles = parseNum(val("sv-miles"));
          const hrs = prog ? parseNum(val("sv-hrs")) : null;
          const level = prog ? chosenLevel() : 0;
          const doOil = truckOil.checked;
          if (!isNum(miles)) { err.textContent = "Enter the miles at service."; return; }
          if (prog && (level || (doOil && t.tm === "cds")) && !isNum(hrs)) { err.textContent = "Enter the TM hrs at service."; return; }
          if (!doOil && !level) { err.textContent = "Tick at least one thing that was done."; return; }
          const cost = parseNum(val("sv-cost").replace(/^\$/, ""));
          if (Number.isNaN(cost)) { err.textContent = "Cost should be a number, like 84.80."; return; }
          const body = plain(t);
          const done = [];
          if (doOil) { body.milesAtOil = miles; if (t.tm === "cds") body.hrsAtOil = hrs; done.push("Truck oil change"); }
          if (level) {
            body.tiers = Object.assign({}, body.tiers || {});
            for (const hh of servicesCovered(t, level, hrs)) body.tiers[String(hh)] = hrs;
            done.push(`TM ${level}-hr service`);
          }
          if (!isNum(body.milesNow) || miles >= body.milesNow) body.milesNow = miles;
          if (prog && isNum(hrs) && (!isNum(body.hrsNow) || hrs >= body.hrsNow)) body.hrsNow = hrs;
          body.readingAt = new Date().toISOString();

            saveTruck(t, body, { kind: "service", miles, hrs: prog ? hrs : null, items: done, note: val("sv-note").slice(0, 500),

            delete drafts[t.id]; saveDrafts();
            closeDialog();
            renderAll();
          } catch (e) { err.textContent = failText(e, "Nothing"); }
        } }))));
}

/** What an edit changed, for the truck's history: name, plate, unit, driver and color by name, anything else as "Truck details edited". */
function editItems(t, body) {
  const s = v => v == null ? "" : typeof v === "object" ? JSON.stringify(Object.keys(v).sort().map(k => [k, v[k]])) : String(v);
  const was = k => s(t[k]);
  const items = [];
  if (s(body.unit) !== was("unit")) items.push(`Renamed from ${t.unit || "(no name)"} to ${body.unit}`);
  if (s(body.plate) !== was("plate")) items.push(`Plate set to ${body.plate || "(none)"}`);
  if (s(body.division) !== was("division")) items.push(`Unit set to ${body.division || "(none)"}`);
  if (s(body.driver) !== was("driver")) items.push(`Driver changed from ${t.driver || "(none)"} to ${body.driver || "(none)"}`);
  if (s(body.color) !== was("color")) items.push(body.color ? "Color changed" : "Color removed");
  const named = ["unit", "plate", "division", "driver", "color"];
  if (Object.keys(body).some(k => !named.includes(k) && s(body[k]) !== was(k))) items.push("Truck details edited");
  return items;
}

            ? { id: (body.unit.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "truck") + "-" + Math.random().toString(36).slice(2, 6), updatedAt: null }
            : t;

/* ---------- report ---------- */
function buildReport() {
  const d = new Date();
  const lines = [`VODA fleet maintenance · ${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`];
  const groups = { due: [], soon: [], gps: [] };
  const paper = [];
  for (const t of scoped()) {
    const v = currentValues(t);
    const r = compute(t, safeNum(v.miles), safeNum(v.hrs));
    for (const line of issueLines(t, r)) groups[line.kind === "gps" ? "gps" : line.status].push(`• ${label(t)}: ${line.text}`);
    for (const p of paperwork(t, today)) if (p.status !== "ok") paper.push(`• ${label(t)}: ${p.label} ${p.shown}${p.status === "due" ? " (past due)" : ` (in ${p.days} days)`}`);
  }
  lines.push("", "OVERDUE", ...(groups.due.length ? groups.due : ["• none"]));
  lines.push("", "DUE SOON", ...(groups.soon.length ? groups.soon : ["• none"]));
  if (groups.gps.length) lines.push("", "TRUCK ALERTS (GPS)", ...groups.gps);
  if (paper.length) lines.push("", "PAPERWORK", ...paper);
  const chk = checkReport();
  if (chk) lines.push("", chk.title.toUpperCase(), ...(chk.lines.length ? chk.lines.map(x => "• " + x) : ["• nothing missed"]));
  return lines.join("\n");
}

function reportRows() {

}
function reportStamp() {
  const d = new Date();
  return { d, iso: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`,
    text: `${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()} ${fmtTime(d)}` };
}
function csvCell(v) {
  const s = v == null ? "" : String(v);
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function buildCsv() {
  const head = ["Name", "Plate", "Unit", "Driver", "Vehicle", "Year", "Status", "Miles now", "Miles saved by", "Oil change every (mi)", "Miles since oil change",
    "Truck oil miles left", "Truckmount", "TM hrs now", "Next TM service", "TM service due at (hrs)", "TM service hrs left",
    "Safety inspection due", "Registration due", "Insurance until", "Paperwork issues", "Last reading",
    "VIN", "Check engine", "Fuel %", "GPS status", "Last GPS report", "Location", "Van engine hrs (reference only)",
    "TM hrs last entered", "TM hrs check this week"];
  const lines = [head];
  for (const { t, e } of reportRows()) {
    const { r, pw } = e;
    const prog = progOf(t);
    const get = lbl => { const p = pw.find(x => x.label === lbl); return p ? p.shown : ""; };
    lines.push([
      t.unit, t.plate, t.division, t.driver, t.vehicle, t.year, r.empty ? "No reading" : statusWord(r.worst),
      isNum(e.v.miles) ? e.v.miles : "", t.readingBy || "",
      t.oilInterval, r.oil ? Math.round(r.oil.used) : "", r.oil ? Math.round(r.oil.left) : "",
      prog ? prog.name : "", prog && isNum(e.v.hrs) ? e.v.hrs : "",
      r.service ? `${r.service.level}-hr` : "", r.service ? r.service.dueAt : "", r.service ? Math.round(r.service.left) : "",
      get("Safety inspection"), get("Registration"), get("Insurance"),
      e.pwBad.map(p => `${p.label} ${p.status === "due" ? "past due" : "due soon"}`).join("; "),
      t.readingAt ? fmtWhen(t.readingAt) : "",
      t.vin || (t.gps ? t.gps.vin : "") || "",
      t.gps ? (t.gps.check === "on" ? "ON" + (t.gps.codes.length ? ": " + t.gps.codes.join(" ") : "") : t.gps.check === "off" ? "Off" : t.gps.check === "none" ? "None reported" : "") : "",
      t.gps && isNum(t.gps.fuel) ? t.gps.fuel : "",
      t.gps ? (t.gps.offline ? "Offline" : t.gps.status) : "",
      t.gps && t.gps.at ? `${fmtWhen(t.gps.at)} ${fmtTime(new Date(t.gps.at))}` : "",
      t.gps ? (t.gps.address || (isNum(t.gps.lat) ? `${t.gps.lat}, ${t.gps.lng}` : "")) : "",
      t.gps && isNum(t.gps.engineHrs) ? t.gps.engineHrs : "",
      t.hrsAt ? `${fmtWhen(t.hrsAt)}${t.hrsBy ? " · " + t.hrsBy : ""}` : "",
      checkWord(tmCheck(t))
    ]);
  }
  return "\ufeff" + lines.map(row => row.map(csvCell).join(",")).join("\r\n");
}
const checkWord = c => !c ? "" : c.state === "done" ? "Done" : c.state === "skipped" ? "Not available" : c.state === "today" ? "Due today" : "Missed";
/** Lines for reports: the week's TM hrs check. */
function checkReport() {
  const chk = scoped().map(t => ({ t, c: tmCheck(t) })).filter(x => x.c);
  if (!chk.length) return null;
  const left = chk.filter(x => x.c.state === "today" || x.c.state === "missed");
  return {
    title: `TM hrs check (Tue ${shortDate(chk[0].c.start)}): ${chk.filter(x => x.c.state === "done").length} of ${chk.length} done`,
    lines: left.map(x => `${label(x.t)}: ${x.c.state === "today" ? "due today" : "missed"} (${x.c.last ? "last entered " + shortDate(x.c.last) : "never entered"})`)

    if (data.status && data.status !== r.status) {
      if (data.status === "To order") Object.assign(r, { orderedAt: "", orderedBy: "", closedAt: "", closedBy: "" });

const LB_LOGO = '<svg viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#1b2b3c"/><path d="M256 92 C318 180 384 248 384 318 A128 128 0 0 1 128 318 C128 248 194 180 256 92 Z" fill="#2fa4da"/><path d="M196 318 L240 362 L320 272" fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/></svg>';   // the app icon

function lbStat(x, per) {

/* ---- the numbers slides: everyone, A to Z, before the places ---- */
const lbAz = (a, b) => a.team.localeCompare(b.team);

}
/** One number cell: the value, a star when it's the column's best, and its label for phones. */

}

}
function lbNumbersSlide(g, st, month) {

  const ytd = Object.fromEntries(st.ytd[g].map(x => [x.team, x.values]));
  const mb = Object.fromEntries(LB_MONTH_METRICS.map(m => [m.key, lbBest(rows, r => r.values[m.key])]));

    h("div", { class: "lbs-head" }, h("div", null, h("p", { class: "lbs-kicker", text: `${lbMonthLong(month)} ${y} · A to Z` }), h("h2", { text: `${g} numbers` })),
      h("div", { class: "lbs-logo" }, lbSvg(LB_LOGO), "VODA Prime")),
    h("div", { class: "lbs-tblwrap" }, h("table", { class: "lbs-tbl" },
      h("thead", null,
        h("tr", { class: "lbs-grp" }, h("th"), h("th", { colspan: String(LB_MONTH_METRICS.length), text: lbMonthLong(month) }), h("th", { class: "ytd", colspan: String(LB_YTD_METRICS.length), text: "Year to date" })),
        h("tr", null, h("th", { text: "Team" }), LB_MONTH_METRICS.map(m => h("th", { text: m.short })), LB_YTD_METRICS.map((m, i) => h("th", { class: i ? "" : "ytd", text: m.short })))),

function lbPresent() {

$("lbsPrev").addEventListener("click", () => lbShowState && lbShowState.go(lbShowState.i - 1));

document.addEventListener("keydown", e => {

/* ---------- install as an app ---------- */
const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;

let installEvt = null;
function renderInstall() {

setInterval(() => { if (document.visibilityState === "visible" && session && CONFIGURED && !dlg.open) refresh(true); }, 90000);

renderInstall();
if (/^#order-list(\/|$)/.test(location.hash)) {   // the link in the checklist email

}
else if (location.hash === "#supplies") { view.tab = "supplies"; saveView(); }
