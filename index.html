<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VODA Prime</title>
<meta name="description" content="VODA Prime: truck maintenance, checklists and the team leaderboard for VODA Cleaning &amp; Restoration.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VODA Prime">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121a23" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root {
  /* Layout: sticky top bar; summary tiles that filter; toolbar; a responsive grid of truck tiles (inline entry);
     an attention sidebar on wide screens; a details panel that slides in from the right. */
  --bg: #eef1f5;
  --surface: #ffffff;
  --surface-2: #f6f8fa;
  --ink: #111a24;
  --muted: #5a6879;
  --line: #e0e6ed;
  --accent: #1f4fbf;
  --accent-ink: #ffffff;
  --accent-soft: #e7eefc;
  --clean: #0f766e;
  --clean-bg: #dcf3ef;
  --ok: #17803d;
  --ok-bg: #e2f3e7;
  --soon: #985a05;
  --soon-bg: #fcefd3;
  --due: #c0281a;
  --due-bg: #fde6e3;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 2px 10px rgba(16, 24, 40, .06);
  --radius: 14px;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1117; --surface: #151d27; --surface-2: #19222d; --ink: #e7ecf2; --muted: #9babbc; --line: #273241;
    --accent: #7ea6ff; --accent-ink: #0b1320; --accent-soft: #1b2a45; --clean: #4fd1c0; --clean-bg: #12302c;
    --ok: #55c57f; --ok-bg: #12301f; --soon: #f0b54d; --soon-bg: #372a10; --due: #ff8072; --due-bg: #3d1814;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1117; --surface: #151d27; --surface-2: #19222d; --ink: #e7ecf2; --muted: #9babbc; --line: #273241;
  --accent: #7ea6ff; --accent-ink: #0b1320; --accent-soft: #1b2a45; --clean: #4fd1c0; --clean-bg: #12302c;
  --ok: #55c57f; --ok-bg: #12301f; --soon: #f0b54d; --soon-bg: #372a10; --due: #ff8072; --due-bg: #3d1814;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.4; -webkit-text-size-adjust: 100%; }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }

/* ---- top bar ---- */
.topbar {
  position: sticky; top: 0; z-index: 30; display: flex; align-items: center; flex-wrap: wrap; gap: 10px 18px;
  padding: 10px 24px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand svg { width: 30px; height: 30px; flex: none; }
.brand h1 { font-family: var(--font-display); font-size: 1.45rem; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; }
.sync { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: .88rem; font-variant-numeric: tabular-nums; }
.sync.offline { color: var(--soon); font-weight: 600; }
.sync.saving { color: var(--accent); font-weight: 600; }
.kpi.tmchk::after { background: var(--soon); }
.kpi.tmchk .num { color: var(--soon); }
.kpi.tmchk.missed::after { background: var(--due); }
.kpi.tmchk.missed .num { color: var(--due); }
.kpi.tmchk.clear::after { background: var(--ok); }
.kpi.tmchk.clear .num { color: var(--ok); }
.flag.ok { background: var(--ok-bg); color: var(--ok); }
.flag.skip { background: var(--line); color: var(--muted); }
.tile-chk { margin: 0; padding: 0 14px 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .8rem; }
.tile-chk:empty { display: none; }
.stale { margin: 2px 0 0; font-size: .76rem; color: var(--muted); font-style: italic; }
.tmcheck { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-top: 12px; padding: 10px 14px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--soon); }
.tmcheck[hidden] { display: none; }
.tmcheck.due { border-left-color: var(--due); }
.tmcheck.ok { border-left-color: var(--ok); }
.tc-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.tc-count { color: var(--muted); font-size: .88rem; font-variant-numeric: tabular-nums; }
.tc-left { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.tc-lbl { font-size: .82rem; font-weight: 700; color: var(--muted); }
.tc-truck { font: inherit; font-size: .8rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; border: 0; cursor: pointer; }
.tc-truck.due { background: var(--due-bg); color: var(--due); }
.tc-truck.soon { background: var(--soon-bg); color: var(--soon); }
.tc-done { color: var(--ok); font-weight: 700; font-size: .9rem; }
.tc-hint { flex-basis: 100%; margin: 0; font-size: .82rem; color: var(--muted); }
.tc-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: .88rem; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; }
.gps-warn { all: unset; cursor: pointer; font-weight: 700; font-size: .82rem; color: var(--soon); background: var(--soon-bg); padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.gps-warn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.top-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600; font-size: .92rem;
  padding: 8px 13px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; white-space: nowrap;
}
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); }
/* Presentation: the same gold as 1st place */
.btn.gold { background: #f2b705; border-color: #dba500; color: #3b2a00; font-weight: 700; }
.btn.gold:hover:not(:disabled) { background: #e5ab00; border-color: #c99700; }
.btn.gold:active { transform: scale(.97); }
.btn.danger { color: var(--due); }
.btn.small { padding: 6px 10px; font-size: .85rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn svg, .icon-btn svg { width: 17px; height: 17px; flex: none; }
.icon-btn { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; color: var(--ink); }
.icon-btn:hover { border-color: var(--accent); }
.btn:focus-visible, .icon-btn:focus-visible, .kpi:focus-visible, .tile-head:focus-visible, .chip-btn:focus-visible, .attn-btn:focus-visible, summary:focus-visible {
  outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px;
}
.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---- page ---- */
.page { padding: 18px 24px 48px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }   /* nothing can make the page wider than the screen */
/* PCs and wide screens: the page sits in one centered column instead of stretching edge to edge, and the top bar
   lines up with it. The column is the same on every tab, so the top bar, the tabs and the buttons stay where they are
   when you switch: Trucks' cards fill it; Checklists, the Leaderboard and Office keep a reading width from its left
   edge (Payroll uses all of it: every tech's columns side by side). */
@media (min-width: 1100px) {
  :root { --page-w: 1560px; }
  html { scrollbar-gutter: stable; }   /* a short page and a long one line up the same (no scrollbar jump) */
  .page { width: 100%; max-width: calc(var(--page-w) + 48px); margin-inline: auto; }
  .topbar { padding-inline: max(24px, calc((100% - var(--page-w)) / 2)); }
  body .sup, body .lb { max-width: 1000px; width: 100%; }
  body[data-tab="leaderboard"][data-lbtab="payroll"] .lb, body[data-tab="leaderboard"][data-lbtab="enter"] .lb { max-width: none; }
  /* Enter numbers: three cards a row across the whole page (from the same left edge) */
  body[data-lbtab="enter"] .lb-enter, body[data-lbtab="enter"] .lb-enter:has(.lb-jobs) { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  /* the buttons sit next to the title instead of across the screen; Employees first, so it doesn't move when
     Presentation shows on Performance */
  body .lb-title { margin-right: 6px; }
  body .lb-acts { margin-left: 0; }
  body #lbPresent { order: 2; }
  body .sup-top > .btn { margin-left: 0; }
}
.banner { border-radius: 12px; padding: 11px 14px; font-weight: 500; background: var(--soon-bg); border: 1px solid var(--line); }
.banner:empty { display: none; }
.installbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; background: var(--surface); border: 1.5px solid var(--accent); border-radius: 12px; padding: 10px 14px; }
.installbar p { margin: 0; flex: 1 1 240px; }

.kpis { display: grid; grid-template-columns: repeat(var(--kpis, 5), minmax(0, 1fr)); gap: 12px; }
.kpi {
  text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 12px 16px; display: grid; gap: 2px; align-content: start; cursor: pointer; position: relative; overflow: hidden;
}
.kpi::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--line); }
.kpi.due::after { background: var(--due); }
.kpi.soon::after { background: var(--soon); }
.kpi.ok::after { background: var(--ok); }
.kpi.paper::after { background: var(--muted); }
.kpi.all::after { background: var(--accent); }
.kpi.engine::after { background: var(--due); }
.kpi.doc.due::after { background: var(--due); }
.kpi.doc.due .num { color: var(--due); }
.kpi.doc.soon::after { background: var(--soon); }
.kpi.doc.soon .num { color: var(--soon); }
.kpi.doc.clear::after { background: var(--ok); }
.kpi.doc.clear .num { color: var(--ok); }
.kpi.engine .num { color: var(--due); }
.kpi .num { font-family: var(--font-display); font-size: 2.1rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi.due .num { color: var(--due); }
.kpi.soon .num { color: var(--soon); }
.kpi.ok .num { color: var(--ok); }
.kpi .lbl { color: var(--muted); font-weight: 700; font-size: .76rem; text-transform: uppercase; letter-spacing: .06em; }
.kpi .lbl .short { display: none; }
@media (max-width: 1279px) { .kpi .lbl .long { display: none; } .kpi .lbl .short { display: inline; } }
.kpi[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent), var(--shadow); }

.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.search { position: relative; flex: 1 1 260px; max-width: 420px; }
.search svg { position: absolute; left: 11px; top: 50%; width: 17px; height: 17px; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search input { width: 100%; font: inherit; padding: 9px 12px 9px 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.chip-btn { padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: .88rem; cursor: pointer; }
.chip-btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.sortsel { font: inherit; font-weight: 600; font-size: .88rem; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.toolbar .count { color: var(--muted); font-size: .88rem; margin-left: auto; font-variant-numeric: tabular-nums; }
.filt-btn { display: none; align-items: center; gap: 6px; white-space: nowrap; }
.filt-btn[aria-pressed="true"], .toolbar.open .filt-btn { border-color: var(--accent); color: var(--accent); }
.filt-btn .n { background: var(--accent); color: var(--accent-ink); border-radius: 999px; font-size: .72rem; padding: 0 6px; line-height: 1.5; }

.layout { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 1280px) {
  .layout { grid-template-columns: minmax(0, 1fr) 320px; }
  .aside { position: sticky; top: 74px; max-height: calc(100vh - 90px); overflow: auto; }
  .how-bottom { display: none; }
}
@media (max-width: 1279px) { .aside { display: none; } }

/* ---- truck tiles ---- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(275px, 1fr)); gap: 14px; align-items: start; }
.tile {
  background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
  display: flex; flex-direction: column; overflow: hidden; position: relative; scroll-margin-top: 80px;
}
.tile::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--line); }
.tile[data-status="due"]::before { background: var(--due); }
.tile[data-status="soon"]::before { background: var(--soon); }
.tile[data-status="ok"]::before { background: var(--ok); }
.tile.flash { box-shadow: 0 0 0 3px var(--accent), var(--shadow); }
.tile { cursor: pointer; }
.tile input:not([readonly]) { cursor: text; }
.tile-head { all: unset; box-sizing: border-box; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; padding: 14px 14px 0; cursor: pointer; }
.tile-title { display: flex; align-items: center; gap: 6px 8px; flex-wrap: wrap; min-width: 0; }
.plate { font-weight: 700; font-size: .8rem; letter-spacing: .07em; padding: 1px 6px; border: 1.5px solid var(--muted); border-radius: 5px; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.div-chip { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.div-chip.cleaning { background: var(--clean-bg); color: var(--clean); }
.div-chip.restoration { background: var(--accent-soft); color: var(--accent); }
.div-chip.none { color: var(--muted); border: 1px dashed var(--line); }
#grid.split .tile-title .div-chip { display: none; }
.tile-foot .miles { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
.grp { grid-column: 1 / -1; display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; margin-top: 10px; padding: 0 2px 7px; border-bottom: 3px solid var(--line); }
.grp:first-child { margin-top: 0; }
.grp-name { font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; text-transform: uppercase; letter-spacing: .04em; line-height: 1.1; }
.grp.restoration { border-bottom-color: var(--accent); }
.grp.restoration .grp-name { color: var(--accent); }
.grp.cleaning { border-bottom-color: var(--clean); }
.grp.cleaning .grp-name { color: var(--clean); }
.grp.none .grp-name { color: var(--muted); }
.grp-count { color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }
.grp-stats { display: inline-flex; gap: 6px; }
.grp-stat { font-size: .74rem; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.grp-stat.due { background: var(--due-bg); color: var(--due); }
.grp-stat.soon { background: var(--soon-bg); color: var(--soon); }
.grp-stat.ok { background: var(--ok-bg); color: var(--ok); }
.grp-hint { color: var(--muted); font-size: .8rem; }
.unit { font-family: var(--font-display); font-weight: 700; font-size: 1.45rem; text-transform: uppercase; letter-spacing: .02em; line-height: 1.05; }
.driver { color: var(--muted); font-weight: 600; }
.tile-sub { margin: 3px 0 0; padding: 0 14px; color: var(--muted); font-size: .84rem; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tag { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); background: var(--accent-soft); padding: 2px 7px; border-radius: 6px; }
.pill { padding: 3px 10px; border-radius: 999px; font-weight: 700; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.pill.due { background: var(--due-bg); color: var(--due); }
.pill.soon { background: var(--soon-bg); color: var(--soon); }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.metrics { padding: 12px 14px; display: grid; gap: 10px; flex: 1; align-content: start; }
.metric { display: grid; gap: 4px; }
.metric-line { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.metric-label { font-size: .74rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.metric-value { font-weight: 700; font-variant-numeric: tabular-nums; }
.metric.due .metric-value { color: var(--due); }
.metric.soon .metric-value { color: var(--soon); }
.metric.ok .metric-value { color: var(--ok); }
.meter { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; }
.meter > span { display: block; height: 100%; background: var(--ok); border-radius: 3px; }
.metric.soon .meter > span, .drow.soon .meter > span { background: var(--soon); }
.metric.due .meter > span, .drow.due .meter > span { background: var(--due); }
.no-reading { margin: 0; color: var(--muted); }
.quick { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); background: var(--surface-2); align-items: end; }
.quick.no-tm { grid-template-columns: minmax(0, 1fr) auto; }
.qf label { display: block; font-size: .7rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 3px; }
.qf input, .df input {
  width: 100%; font: inherit; font-weight: 700; font-size: 1.05rem; padding: 7px 9px; border-radius: 9px; border: 1.5px solid var(--line);
  background: var(--surface); color: var(--ink); font-variant-numeric: tabular-nums;
}
.qf input:focus, .df input:focus, .field input:focus, .field select:focus, .field textarea:focus, .search input:focus {
  outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
}
.qf .gps { font-size: .66rem; color: var(--accent); margin-left: 4px; }
.qf input.locked, .df input.locked { background: transparent; border-style: dashed; color: var(--muted); }
.quick.view-only { grid-template-columns: minmax(0, 1fr); }
.user-row { display: grid; gap: 6px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.user-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.user-top strong { font-size: 1rem; }
.user-meta { color: var(--muted); font-size: .84rem; }
.user-acts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.user-acts select { font: inherit; font-size: .88rem; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.code-box { display: grid; gap: 8px; padding: 12px; border-radius: 10px; border: 1.5px solid var(--accent); background: var(--accent-soft); }
.code-box .code { font-family: var(--font-display); font-size: 1.8rem; font-weight: 700; letter-spacing: .08em; color: var(--ink); }
.warn { margin: 0; padding: 0 14px 8px; background: var(--surface-2); color: var(--soon); font-weight: 600; font-size: .82rem; }
.warn:empty { display: none; }
.tile-foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 8px; padding: 0 14px 10px; font-size: .8rem; color: var(--muted); background: var(--surface-2); }
.tile-foot .left { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
.paper-badge { font-weight: 700; color: var(--due); background: var(--due-bg); padding: 1px 7px; border-radius: 999px; }
.paper-badge.soon { color: var(--soon); background: var(--soon-bg); }
.link { all: unset; cursor: pointer; color: var(--accent); font-weight: 700; }
.link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
/* GPS line on a tile: alerts, then status · place · fuel */
.tile-gps { margin: 0; padding: 0 14px 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .8rem; color: var(--muted); }
.tile-gps:empty { display: none; }
.gps-txt { min-width: 0; flex: 1 1 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.flag { font-weight: 700; font-size: .72rem; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.flag.due { background: var(--due-bg); color: var(--due); }
.flag.soon { background: var(--soon-bg); color: var(--soon); }
/* A truck's own color: its name in that color and a stripe down the left edge. The tile stays white. */
.tile.colored::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--truck); pointer-events: none; }
.colored .unit { color: var(--truck-text); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .colored .unit { color: var(--truck-text-dark); } }
:root[data-theme="dark"] .colored .unit { color: var(--truck-text-dark); }
.empty-grid { grid-column: 1 / -1; background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); padding: 28px; text-align: center; color: var(--muted); }

/* ---- sidebar ---- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; display: grid; gap: 8px; }

.attn-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.attn-btn { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 10px 1fr; gap: 2px 10px; width: 100%; padding: 7px 8px; border-radius: 8px; cursor: pointer; }
.attn-btn:hover { background: var(--surface-2); }
.attn-btn strong { font-weight: 700; }
.attn-btn span.txt { grid-column: 2; color: var(--muted); font-size: .86rem; font-variant-numeric: tabular-nums; }
.dot { width: 10px; height: 10px; border-radius: 50%; align-self: center; }
.dot.due { background: var(--due); } .dot.soon { background: var(--soon); } .dot.ok { background: var(--ok); }
details.paperwork summary, details.how summary { cursor: pointer; font-weight: 700; color: var(--accent); }
.how ul { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 4px; color: var(--muted); font-size: .88rem; }
.empty-ok { margin: 0; color: var(--ok); font-weight: 600; }

/* ---- details panel ---- */
dialog.drawer {
  margin: 0 0 0 auto; width: min(560px, 100vw); height: 100dvh; max-height: 100dvh; max-width: 100vw; border: none; border-left: 1px solid var(--line);
  border-radius: 0; padding: 0; background: var(--surface); color: var(--ink); overflow: auto;
}
dialog.drawer::backdrop { background: rgba(8, 12, 18, .45); }
.dr-top { position: sticky; top: 0; z-index: 2; background: var(--surface); border-bottom: 1px solid var(--line); }
.dr-head { padding: 10px 12px 7px 16px; background: var(--surface); }
.dr-tabs { display: flex; gap: 2px; padding: 0 12px; overflow-x: auto; scrollbar-width: none; }
.dr-tabs::-webkit-scrollbar { display: none; }
.dr-tab { all: unset; box-sizing: border-box; cursor: pointer; padding: 9px 10px 8px; font-weight: 700; font-size: .88rem; color: var(--muted); white-space: nowrap; border-bottom: 3px solid transparent; }
.dr-tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.dr-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 6px; }
.tab-panel[hidden] { display: none !important; }
.dr-head .titles { flex: 1; min-width: 0; }
.title-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.icon-btn.sm { width: 30px; height: 30px; border-radius: 8px; flex: none; }
.icon-btn.sm svg { width: 15px; height: 15px; }
.rename { display: grid; gap: 8px; }
.rn-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.rn-fields label { display: block; font-size: .74rem; font-weight: 700; color: var(--muted); margin-bottom: 3px; text-transform: uppercase; letter-spacing: .05em; }
.rn-fields input, .rn-fields select { width: 100%; font: inherit; font-weight: 700; font-size: 1.05rem; padding: 8px 10px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--surface-2); color: var(--ink); }
.rn-fields input:focus, .rn-fields select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.rn-actions { display: flex; gap: 8px; }
.dr-head .unit { font-size: 1.4rem; }
.dr-head .tile-title { margin: 0 auto 0 0; font-size: inherit; flex-wrap: nowrap; min-width: 0; }
.dr-head .tile-title .unit { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dr-head .title-row .pill { flex: none; }
.dr-sub { padding: 0; margin-top: 3px; font-size: .8rem; gap: 4px 6px; }
.dr-sub .div-chip { font-size: .62rem; padding: 2px 7px; }
.dr-sub .tag { font-size: .64rem; padding: 1px 6px; }
.dr-edit { flex: none; gap: 5px; padding-inline: 10px; }
.dr-edit svg { width: 14px; height: 14px; }
.shop-row { display: block; margin-top: 4px; color: var(--muted); }
.at-shop { color: var(--ok); }
.dr-body { padding: 16px 18px 28px; display: grid; gap: 14px; }
.dfields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.df label { display: block; font-size: .78rem; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
.df input { font-size: 1.3rem; padding: 10px 12px; }
.drow { display: grid; gap: 5px; padding: 11px 13px; border-radius: 11px; background: var(--surface-2); border: 1px solid var(--line); }
.drow .metric-value { font-size: 1.08rem; }
.drow.due .metric-value { color: var(--due); } .drow.soon .metric-value { color: var(--soon); } .drow.ok .metric-value { color: var(--ok); }
.drow-detail { margin: 0; color: var(--muted); font-size: .86rem; font-variant-numeric: tabular-nums; }
details.tasks summary { cursor: pointer; font-weight: 700; color: var(--accent); font-size: .9rem; }
details.tasks h4 { margin: 10px 0 4px; font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
details.tasks ul { margin: 0; padding-left: 20px; display: grid; gap: 3px; font-size: .92rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips:empty { display: none; }
.chip { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px; font-weight: 600; font-size: .82rem; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.chip.due { background: var(--due-bg); color: var(--due); border-color: transparent; }
.chip.soon { background: var(--soon-bg); color: var(--soon); border-color: transparent; }
.dr-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.dr-section h3 { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }
.meta { margin: 0; color: var(--muted); font-size: .86rem; }
.dr-head.colored { border-top: 6px solid var(--truck); }
.gps-list { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; padding: 11px 13px; border-radius: 11px; background: var(--surface-2); border: 1px solid var(--line); font-size: .92rem; }
.gps-list dt { color: var(--muted); font-weight: 700; font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; padding-top: 2px; }

.gps-list .warnc { color: var(--soon); font-weight: 700; }
.gps-list small { display: block; color: var(--muted); }
.code-link { color: var(--due); font-weight: 700; }
/* service history */
.svc-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.svc-head h3 { margin: 0; }
.svc-actions { display: flex; gap: 6px; }

.svc-q:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.svc-filters { margin-bottom: 6px; }
.chip-btn.sm { padding: 4px 10px; font-size: .8rem; }
.chip-btn.warn-chip { color: var(--soon); border-color: var(--soon); }
.svc-list { list-style: none; margin: 8px 0; padding: 0; display: grid; gap: 6px; }
.svc-item { all: unset; box-sizing: border-box; display: grid; gap: 3px; width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; }
.svc-item:hover { border-color: var(--accent); }
.svc-item:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }
.svc-item.flagged { border-color: var(--soon); }
.svc-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.svc-tag { font-size: .66rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 2px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.svc-cost { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; }
.svc-what { white-space: pre-line; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.svc-meta { color: var(--muted); font-size: .84rem; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.svc-check { color: var(--soon); font-weight: 700; font-size: .84rem; }
.dlg .svc-flag { padding: 9px 12px; border-radius: 10px; background: var(--soon-bg); color: var(--soon); font-weight: 600; }
.svc-typegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 6px 10px; }
/* color picker */
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { all: unset; box-sizing: border-box; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; border: 2px solid rgba(0, 0, 0, .14); position: relative; display: grid; place-items: center; }
.sw.none { background: var(--surface); border: 2px dashed var(--muted); }
.sw.none::after { content: ""; width: 70%; height: 2px; background: var(--muted); transform: rotate(-45deg); }
.sw[aria-checked="true"], .sw-more.on { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink); }
.sw:focus-visible, .sw-more:focus-within { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 3px; }
.sw-more { background: conic-gradient(#e11d48, #f59e0b, #84cc16, #06b6d4, #3b82f6, #a855f7, #e11d48); }
.sw-more input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
.sw-more span { font-weight: 800; font-size: 1.1rem; color: #fff; text-shadow: 0 0 3px #000; pointer-events: none; }
.rn-color { grid-column: 1 / -1; }

/* ---- forms and dialogs (log service, edit, settings) ---- */
dialog#dlg { border: 1px solid var(--line); border-radius: 16px; padding: 0; width: min(600px, calc(100% - 24px)); max-height: calc(100% - 24px); overflow: auto; background: var(--surface); color: var(--ink); }

/* the ✕: stays at the window's top right while it scrolls (a zero-height strip, so it takes no room) */
.dlg-xbar { position: sticky; top: 0; height: 0; z-index: 5; }
.dlg-x { all: unset; box-sizing: border-box; position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; font-size: 1.05rem; font-weight: 700; color: var(--muted); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); cursor: pointer; }
.dlg-x:hover { color: var(--ink); border-color: var(--accent); }
.dlg-x:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }
.dlg > h3:first-child { padding-right: 40px; }
.dlg { padding: 18px; display: grid; gap: 14px; }
.dlg:focus { outline: none; }
.dlg h3 { font-family: var(--font-display); font-size: 1.5rem; text-transform: uppercase; letter-spacing: .02em; }
.dlg p { margin: 0; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.field { display: grid; gap: 4px; }
.field label { font-weight: 600; font-size: .85rem; color: var(--muted); }
.field input, .field select, .field textarea { width: 100%; font: inherit; color: var(--ink); background: var(--surface-2); border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 12px; }
.field .hint, .hint { font-size: .8rem; color: var(--muted); }
fieldset { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 0; display: grid; gap: 8px; }
legend { font-weight: 700; font-size: .85rem; color: var(--muted); padding: 0 4px; }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.check input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--accent); flex: none; }
.check small { display: block; color: var(--muted); }
.dlg-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; }
.dlg-foot .right { display: flex; gap: 8px; margin-left: auto; }
.dlg-err { margin: 0; color: var(--due); font-weight: 600; }
.dlg-err:empty { display: none; }
.history { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: .9rem; }
.history li { padding: 6px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.history small { color: var(--muted); }
textarea.report { width: 100%; min-height: 220px; font: inherit; font-size: .9rem; padding: 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface-2); color: var(--ink); }

/* ---- sign-in ---- */
.gate { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 22px; display: grid; gap: 14px; width: min(460px, 100%); margin: 40px auto; }

.gate code { font-size: .9em; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; }

.toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 10px; font-weight: 600; box-shadow: 0 6px 24px rgba(0, 0, 0, .25); max-width: calc(100% - 32px); }

/* ---- Trucks | Supplies switch ---- */
.views { display: flex; gap: 4px; padding: 4px; margin-bottom: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 13px; box-shadow: var(--shadow); width: fit-content; max-width: 100%; }
.view-btn { all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 20px; border-radius: 9px;
  font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }

.view-btn:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }
.vbadge { font-family: var(--font-body); font-size: .76rem; font-weight: 700; letter-spacing: 0; min-width: 22px; padding: 1px 7px; border-radius: 999px; background: var(--soon-bg); color: var(--soon); text-align: center; line-height: 1.45; }

/* ---- cleaning supplies ---- */
.sup { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; max-width: 920px; }
.sup-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.sup-notice { margin: 0; padding: 8px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--ink); font-weight: 600; font-size: .88rem; white-space: pre-line; }
.sup-title { font-family: var(--font-display); font-size: 1.5rem; text-transform: uppercase; letter-spacing: .03em; }
.list-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.list-chips::-webkit-scrollbar { display: none; }
.list-chip { all: unset; box-sizing: border-box; cursor: pointer; flex: none; display: inline-flex; align-items: center; gap: 7px; padding: 7px 14px; border-radius: 999px;
  border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; font-size: .92rem; color: var(--ink); white-space: nowrap; }
.list-chip[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.acc { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }

.sup-top > .btn { margin-left: auto; }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 11px; background: var(--surface-2); border: 1px solid var(--line); }
.seg-btn { all: unset; box-sizing: border-box; cursor: pointer; padding: 7px 14px; border-radius: 8px; font-weight: 700; font-size: .95rem; color: var(--muted); display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
/* the picked option is filled in VODA blue, so it's clear what's selected */
.seg-btn { transition: background-color .15s ease, color .15s ease; }
.seg-btn:hover:not([aria-selected="true"]) { color: var(--ink); }
.seg-btn:active { transform: scale(.97); }
.seg-btn[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); box-shadow: 0 1px 3px rgba(16, 24, 40, .18); }

.seg-btn:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 1px; }
.seg-btn .n { font-size: .74rem; padding: 0 7px; border-radius: 999px; background: var(--line); color: var(--ink); line-height: 1.5; }
.seg-btn .n.hot { background: var(--soon-bg); color: var(--soon); }
.sup-last { margin: -4px 0 0; color: var(--muted); font-size: .88rem; }
.sup-last strong { color: var(--ink); }
.sup-hint { margin: 0; color: var(--muted); }
.sup-sec { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.sup-sec-head { display: flex; align-items: baseline; gap: 10px; padding: 10px 14px 8px; border-left: 6px solid var(--sec); }
.sup-sec-head h3 { min-width: 0; }
.sup-sec-head .cnt { margin-left: auto; white-space: nowrap; }
.sup-sec-head h3 { font-family: var(--font-display); font-size: 1.25rem; text-transform: uppercase; letter-spacing: .04em; color: var(--sec-text); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .sup-sec-head h3 { color: var(--sec-text-dark); } }
:root[data-theme="dark"] .sup-sec-head h3 { color: var(--sec-text-dark); }
.sup-sec-head .cnt { color: var(--muted); font-size: .85rem; font-weight: 600; }
.sup-sec-head .cnt.on { color: var(--soon); font-weight: 700; }
.sup-list { list-style: none; margin: 0; padding: 0; }
.sup-item { display: flex; align-items: center; gap: 6px; padding: 3px 10px 3px 4px; border-top: 1px solid var(--line); min-height: 54px; }
.sup-item.marked { background: var(--soon-bg); }
.sup-tap { all: unset; box-sizing: border-box; cursor: pointer; flex: 1; min-width: 0; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 0 10px; align-items: center; padding: 8px 6px 8px 8px; border-radius: 9px; }
.sup-tap:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: -2px; }
.sup-box { grid-row: span 2; width: 24px; height: 24px; border-radius: 7px; border: 2px solid color-mix(in srgb, var(--muted) 70%, transparent); display: grid; place-items: center; color: #fff; }
.marked .sup-box { background: var(--soon); border-color: var(--soon); }
.locked .sup-tap { cursor: default; }
.locked .sup-box { border-style: dashed; opacity: .55; }
.sup-box svg { width: 16px; height: 16px; }
.sup-name { font-weight: 700; font-size: 1.02rem; line-height: 1.25; overflow-wrap: anywhere; }
.sup-sub { color: var(--muted); font-size: .82rem; display: flex; gap: 4px 8px; flex-wrap: wrap; align-items: center; }
.sup-sub:empty { display: none; }
.sup-chip { font-size: .72rem; font-weight: 700; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.sup-chip.to { color: var(--soon); border: 1.5px solid var(--soon); }
.sup-chip.ord { background: var(--accent-soft); color: var(--accent); white-space: normal; }
.sup-lastord { flex-basis: 100%; font-size: .8rem; color: var(--muted); }

<script>
"use strict";
// <logic>
const SOON_MILES = 500;   // from the sheet: yellow when under 500 mi left
const SOON_HRS = 20;      // from the sheet: yellow within 20 TM hrs of the next service
const COMBINE_HRS = 20;   // services due within 20 hrs of each other are done together
const DEFAULT_CDS_MILES_PER_HR = 15;

const PROGRAMS = {
  cds: { name: "CDS 4.6 / 4.8", selfPowered: false, tiers: [
    { h: 100, oil: "truck", tasks: [
      "Engine oil – change",
      "Engine air cleaner – inspect",
      "Battery terminals – clean as needed" ] },
    { h: 400, tasks: [
      "Blower oil – change",
      "Pump oil – change",
      "Vehicle fuel lines – check for chafing or wear",
      "CDS wiring harness – check for chafing or wear",
      "Vehicle wiring harness – check for chafing or wear",
      "CDS fasteners – check blower, drive shaft, front end",
      "Drive shaft – grease spline (if so equipped)",
      "Bearings / power pack pillow block – grease",
      "Chemical pump – inspect",
      "Chemical pump diaphragm – check for wear",
      "Chemical pump valves – check for wear",
      "Water box float valve – remove stem and lubricate" ] },
    { h: 1000, tasks: [
      "Vehicle – complete service",
      "Cooling system – flush",
      "Transmission fluid – change",
      "Drive shaft – grease U-joints and splines" ] } ] },
  legend: { name: "Legend GT", selfPowered: true, tiers: [
    { h: 100, tasks: [
      "Vacuum relief valve – check, adjust up to 13″ Hg if needed",
      "O-rings – lubricate (o-ring lubricant only, Legend Brands P/N 13-003)",
      "Belts – check for wear, re-tension, check pulley alignment",
      "Battery terminals – clean",
      "Spark plugs – check (OEM only)",
      "Engine oil and filter – change" ] },
    { h: 500, tasks: [
      "Water pump – change crankcase oil",
      "Engine – replace in-line fuel filter",
      "Pulleys and hubs – check for proper torque",
      "Chemical pump – change diaphragm and check valves, inspect disc",
      "Vacuum pump – grease bearings on pulley end" ] },
    { h: 1000, tasks: [
      "Spark plugs – replace (OEM only)",
      "Engine air filter element – replace" ] },
    { h: 2000, tasks: [
      "All belts – replace",
      "Vacuum pump – drain, flush and replace gear end oil" ] } ] },
  apex: { name: "Apex 570", selfPowered: true, tiers: [
    { h: 100, tasks: [
      "Vacuum relief valve – check, adjust up to 13″ Hg if needed",
      "Pressure regulator – lubricate o-rings (Sapphire Scientific P/N 13-003)",
      "Belts – re-tension all belts",
      "Battery terminals – clean",
      "Spark plugs – check (OEM only)" ] },
    // Sapphire's Apex 570 manual (Rev M): engine oil and filter every 200 hrs, never longer. Until a 200-hr service is
    // logged, the last 100-hr service counts as the last oil change (it used to include one).
    { h: 200, since: 100, tasks: [
      "Engine oil and filter – change (OEM filter only)",
      "Engine air filter – check" ] },
    { h: 500, tasks: [
      "Pressure pump – change crankcase oil",
      "Engine – replace in-line fuel filter",
      "Pulleys and hubs – check for proper torque",
      "Chemical pump – change diaphragm and check valves, inspect disc" ] },
    { h: 1000, tasks: [
      "Vacuum pump – drain, flush and replace oil",
      "Spark plugs – replace (OEM only)",
      "Engine air filter element – replace",
      "Engine valves – adjust to .0057–.0073 in." ] },
    { h: 2000, tasks: [
      "All belts – replace" ] } ] }
};

const RANK = { ok: 0, soon: 1, due: 2 };
const isNum = v => typeof v === "number" && Number.isFinite(v);
const stMiles = left => left <= 0 ? "due" : left < SOON_MILES ? "soon" : "ok";
const stHrs = left => left <= 0 ? "due" : left <= SOON_HRS ? "soon" : "ok";
const worstOf = list => list.reduce((w, s) => RANK[s] > RANK[w] ? s : w, "ok");

/** When a service was last done: saved hrs, or (for a newly added service) the one it used to be part of, or the last round number. */
function lastDone(t, tr, hrs) {
  const saved = t.tiers ? t.tiers[String(tr.h)] : undefined;
  if (isNum(saved)) return saved;
  const before = tr.since && t.tiers ? t.tiers[String(tr.since)] : undefined;
  return isNum(before) ? before : Math.floor(hrs / tr.h) * tr.h;
}
/** The services a logged service counts for at those hrs: itself, the smaller ones that fit into it, and any already due. */
function servicesCovered(t, level, hrs) {
  const prog = PROGRAMS[t.tm];
  if (!prog || !level) return [];
  return prog.tiers.filter(tr => tr.h === level ||
    (tr.h < level && (level % tr.h === 0 || (isNum(hrs) && lastDone(t, tr, hrs) + tr.h <= hrs + COMBINE_HRS)))).map(tr => tr.h);
}

function compute(t, miles, hrs) {
  const r = { oil: null, service: null, worst: "ok", empty: true };
  const prog = PROGRAMS[t.tm] || null;

  if (isNum(miles) && isNum(t.milesAtOil) && isNum(t.oilInterval)) {
    const driven = miles - t.milesAtOil;
    let tmHrs = null, tmMiles = 0;
    const factor = isNum(t.cdsMilesPerHr) ? t.cdsMilesPerHr : DEFAULT_CDS_MILES_PER_HR;
    if (t.tm === "cds" && isNum(hrs) && isNum(t.hrsAtOil)) {
      tmHrs = hrs - t.hrsAtOil;
      tmMiles = tmHrs * factor;
    }
    const used = driven + tmMiles;
    const left = t.oilInterval - used;
    r.oil = { driven, tmHrs, tmMiles, factor, used, left, interval: t.oilInterval, status: stMiles(left) };
  }

  // The truckmount's own engine oil is one of its services (Legend GT every 100 hrs, Apex 570 every 200 hrs), not a separate countdown.
  if (prog && isNum(hrs)) {
    const tiers = prog.tiers.map(tr => {
      const last = lastDone(t, tr, hrs);
      return { h: tr.h, oil: tr.oil || null, tasks: tr.tasks, last, dueAt: last + tr.h };
    });
    const soonest = Math.min(...tiers.map(x => x.dueAt));
    const due = tiers.filter(x => x.dueAt <= soonest + COMBINE_HRS);
    const level = Math.max(...due.map(x => x.h));
    // What to do now: everything due, plus the smaller services that fit into this one (a 500-hr includes the 100-hr,
    // not the 200-hr).
    const doNow = tiers.filter(x => due.includes(x) || (x.h < level && level % x.h === 0));
    const laterMap = new Map();
    for (const x of tiers.filter(x => !doNow.includes(x))) {
      laterMap.set(x.dueAt, Math.max(laterMap.get(x.dueAt) || 0, x.h));
    }
    const later = [...laterMap.entries()].sort((a, b) => a[0] - b[0]).map(([at, lv]) => ({ at, level: lv }));
    const left = soonest - hrs;
    r.service = { dueAt: soonest, left, level, doNow, later, status: stHrs(left) };
  }

  const parts = [r.oil, r.service].filter(Boolean);
  r.empty = parts.length === 0;
  r.worst = worstOf(parts.map(x => x.status));
  return r;
}

function parseDay(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || "");
  return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
}
function endOfMonth(s) {
  const m = /^(\d{4})-(\d{2})$/.exec(s || "");
  return m ? new Date(+m[1], +m[2], 0) : null;
}
function paperwork(t, today) {
  const out = [];
  const add = (label, date, shown) => {
    if (!date) return;
    const days = Math.round((date - today) / 864e5);
    out.push({ label, shown, days, status: days < 0 ? "due" : days <= 30 ? "soon" : "ok" });
  };
  add("Safety inspection", parseDay(t.inspectionDue), fmtDay(t.inspectionDue));
  add("Registration", endOfMonth(t.registrationDue), fmtMonth(t.registrationDue));
  add("Insurance", parseDay(t.insuranceUntil), fmtDay(t.insuranceUntil));
  return out;
}
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDay(s) { const d = parseDay(s); return d ? `${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}` : ""; }
function fmtMonth(s) { const d = endOfMonth(s); return d ? `${MONTHS[d.getMonth()]} ${d.getFullYear()}` : ""; }
function fmt(n) { return isNum(n) ? n.toLocaleString("en-US", { maximumFractionDigits: 1 }) : "–"; }
// </logic>

// <leaderboard-logic>
/* ---------- Leaderboard: the numbers typed in each day, added up and ranked ----------
   The numbers are typed into the app the way they were typed into the two sheets:
   - each truck's day: jobs, work day, revenue, # of techs ("5. Revenue per truck")
   - each technician's day: up sale, add-on sale, rugs in plant, additional service, jobs ("2. Technician monthly sales")
   - each team's 5-star reviews for the month (4 and 3 stars aren't counted)
   Saved as a roster ({ teams: [{ name, unit, from: "2026-01", to: "" }], goal }) and one document per month:
   { days: { "2026-11-02": { t: { John: [jobs, workDays, revenue, techs] }, s: { John: [up, addon, rugs, extra, jobs] },
     at, by } }, reviews: { John: 5 }, rat, rby }. A blank box is null.
   The ranking is the "5. REVENUE PER TRUCK" sheet's (rows 147-227):
   - Teams are ranked inside their unit (Cleaning, Restoration) and across the whole company.
   - For every number, the highest gets rank 1 (ties share a rank). A team's score is its ranks added up; the lowest
     score is #1. Equal scores share a place and the next team takes the next number (1, 1, 2), as in the sheet.
   - Month: per job, daily per truck, total revenue, sale per job, technician sales, reviews.
   - Year to date (from January 1): technician sales, total revenue, per job, daily per truck, reviews, counted only
     from the months a team is on the board (the roster's from and to months). */
const LB_MONTH_NAMES = ["january", "february", "march", "april", "may", "june", "july", "august", "september", "october", "november", "december"];
const LB_GROUPS = ["Cleaning", "Restoration"];
const LB_MONTH_METRICS = [
  { key: "perJob", label: "Per job", short: "Per job", money: true },
  { key: "perDay", label: "Daily per truck", short: "Per day", money: true },
  { key: "revenue", label: "Total revenue", short: "Revenue", money: true },
  { key: "salePerJob", label: "Sale per job", short: "Sale/job", money: true },
  { key: "sales", label: "Technician sales", short: "Sales", money: true },
  { key: "reviews", label: "Reviews", short: "Reviews", money: false }];
const LB_YTD_METRICS = [
  { key: "sales", label: "Technician sales", short: "Sales", money: true },
  { key: "revenue", label: "Total revenue", short: "Revenue", money: true },
  { key: "perJob", label: "Per job", short: "Per job", money: true },
  { key: "perDay", label: "Daily per truck", short: "Per day", money: true },
  { key: "reviews", label: "Reviews", short: "Reviews", money: false }];
/** What is typed for a truck's day and for a technician's day, in the order they're saved. */
const LB_TRUCK = [
  { key: "jobs", label: "Jobs" },
  { key: "workDays", label: "Work day" },
  { key: "revenue", label: "Revenue", money: true },
  { key: "techs", label: "# of techs" }];
const LB_SALE = [
  { key: "up", label: "Up sale", money: true },
  { key: "addon", label: "Add-on sale", money: true },
  { key: "rugs", label: "Rugs in plant", money: true },
  { key: "extra", label: "Additional service", money: true },
  { key: "saleJobs", label: "Jobs" }];
const LB_REVIEW = [{ key: "reviews", label: "5-star reviews" }];   // a team's reviews that day
const LB_PART_LEN = { t: LB_TRUCK.length, s: LB_SALE.length, r: LB_REVIEW.length };
const LB_GOAL = 3000;   // each technician's monthly sales goal (the sheet's MONTHLY NEED)
// How the sheets spell some names
const LB_ALIASES = { chriss: "Chris", dereck: "Derek", hary: "Harry", jhon: "John", fredy: "Freddy" };

/** "JOHN'S TEAM", "John's Jobs", "Hary Jobs", " John " → "John". Empty for headings and blanks. */
function lbName(raw) {
  let s = String(raw == null ? "" : raw).replace(/\s+/g, " ").trim();
  if (!s || typeof raw === "number") return "";
  s = s.replace(/(['’`]s)?\s+(team|jobs?|truck)$/i, "").replace(/['’`]s$/i, "").trim();
  if (!/^[a-z][a-z .-]{0,30}$/i.test(s)) return "";
  const k = s.toLowerCase();
  const name = LB_ALIASES[k] || k.replace(/(^|[ .-])([a-z])/g, (m, a, b) => a + b.toUpperCase());
  return LB_AKA[name.toLowerCase()] || name;
}
/** Former names → today's names: someone renamed in Employees keeps his old name on the old sheets, so an Excel copy of
 *  them still counts for him. A former name that someone else has now stays that person's. Set before reading Excel. */
let LB_AKA = {};
function lbSetAka(cfg) {
  const c = lbCleanConfig(cfg), all = c.teams.concat(c.reviewers), now = new Set(all.map(p => p.name.toLowerCase()));
  LB_AKA = {};
  for (const p of all) for (const a of p.aka || []) if (!now.has(a.toLowerCase())) LB_AKA[a.toLowerCase()] = p.name;
  return LB_AKA;
}

const lbMonthKey = (y, m) => `${y}-${String(m).padStart(2, "0")}`;
/** "November 2026" or "Nov 2026" → 11 when the year matches, else 0. */
function lbSheetMonth(name, year) {
  const m = /^\s*([a-z]+)\.?\s+(\d{4})\s*$/i.exec(String(name || ""));
  if (!m || Number(m[2]) !== Number(year)) return 0;
  const w = m[1].toLowerCase();
  const i = LB_MONTH_NAMES.findIndex(n => n === w || (w.length >= 3 && n.startsWith(w)) || (w === "sept" && n === "september"));
  return i + 1;
}

/* ---- this year's history from the two sheets (Excel copies), turned into typed days ---- */
/** "5. REVENUE PER TRUCK": each month tab's 8 truck columns (jobs, work days, revenue, # of techs) in week blocks
 *  ending in "Weekly Totals", the CLEANING and RESTORATION lists and the REVIEWS table in column A (5 stars only).

function lbRevenueDays(tabs, year) {
  const out = { days: {}, board: {}, slots: {}, reviews: {}, notes: [], warnings: [], inferred: {} };
  const monthTabs = tabs.map(lbTab).map(t => ({ t, m: lbSheetMonth(t.name, year) })).filter(x => x.m).sort((a, b) => a.m - b.m);

  const cap = s => s.replace(/^./, c => c.toUpperCase());

    const key = lbMonthKey(year, m), mname = cap(LB_MONTH_NAMES[m - 1]);
    // each truck is "Jobs | Work Days | <name>'s truck | # of techs" (before August 2022 there was no # of techs column);
    // when the Jobs column only has an initial ("J. Jobs", 2022-2023) the truck column's name is used

      const head = lbText(t.get(2, c)), next = lbText(t.get(2, c + 1));

  if (view.filter === "paper") list = list.filter(x => x.e.pwBad.length);

function updateTile(id) {

  if (!t || !tile) return;
  const e = evalTruck(t);
  const { r, v } = e;
  const parts = [];
  if (r.empty) parts.push(h("p", { class: "no-reading", text: "Enter the readings to see what's due." }));
  if (r.oil) parts.push(metric(t.tm === "cds" ? "Truck oil · CDS" : "Truck oil", oilText(r.oil), r.oil.status, r.oil.used / r.oil.interval));
  if (r.service) parts.push(metric("TM service", shortService(r.service), r.service.status, 1 - r.service.left / 100));

  tile.dataset.status = r.empty ? "none" : r.worst;
  const pill = $("pill-" + id);

  pill.textContent = r.empty ? "No reading" : statusWord(r.worst);

function updateDrawer(id) {
  const t = byId(id); if (!t || !$("d-res")) return;
  const e = evalTruck(t);
  const { r, v } = e;
  const res = $("d-res");
  const out = [];
  if (r.empty) out.push(h("p", { class: "no-reading", text: "Enter the readings to see what's due." }));
  if (r.oil) {
    const o = r.oil;
    const detail = t.tm === "cds" && o.tmHrs != null
      ? `${fmt(o.driven)} mi driven + ${fmt(o.tmHrs)} TM hrs × ${fmt(o.factor)} = ${fmt(o.used)} of ${fmt(o.interval)} mi`
      : `${fmt(o.driven)} of ${fmt(o.interval)} mi driven since the change at ${fmt(t.milesAtOil)}`;
    out.push(h("div", { class: "drow " + o.status },
      h("div", { class: "metric-line" }, h("span", { class: "metric-label", text: t.tm === "cds" ? "Truck oil (miles + TM hrs)" : "Truck oil" }), h("span", { class: "metric-value", text: oilText(o) })),
      meter(o.used / o.interval), h("p", { class: "drow-detail", text: detail })));
  }
  if (r.service) {
    const s = r.service;
    const laterTxt = s.later.length ? " · Then " + s.later.map(x => `${x.level}-hr at ${fmt(x.at)}`).join(", ") : "";
    const count = s.doNow.reduce((n, x) => n + x.tasks.length, 0);
    out.push(h("div", { class: "drow " + s.status },
      h("div", { class: "metric-line" }, h("span", { class: "metric-label", text: "Next TM service" }), h("span", { class: "metric-value", text: serviceText(s) })),
      h("p", { class: "drow-detail", text: `Due at ${fmt(s.dueAt)} hrs${laterTxt}` }),
      h("details", { class: "tasks", open: openTasks.has(id) || s.status !== "ok", ontoggle: ev => { ev.target.open ? openTasks.add(id) : openTasks.delete(id); } },
        h("summary", { text: `What to do at ${fmt(s.dueAt)} hrs (${count} items)` }),
        s.doNow.slice().reverse().map(x => [h("h4", { text: `${x.h}-hr items` }), h("ul", null, x.tasks.map(task => h("li", { text: task })))]))));
  }
  res.replaceChildren(...out);
  $("d-paper").replaceChildren(...e.pw.map(p => {
    const when = p.status === "due" ? "past due" : p.status === "soon" ? `in ${p.days} days` : "";
    return h("span", { class: "chip " + (p.status === "ok" ? "" : p.status), text: `${p.label} ${p.shown}${when ? " · " + when : ""}` });
  }));
  const pill = $("d-pill");
  pill.className = "pill " + (r.empty ? "" : r.worst);
  pill.textContent = r.empty ? "No reading" : statusWord(r.worst);
  $("d-warn").textContent = readingWarnings(t, v);
  const st = saveState(t, v);
  const save = $("dsave-" + id);
  if (save) {
    save.disabled = !(st.changed || st.confirm) || st.invalid;
    save.textContent = st.confirm ? "Confirm TM hrs" : progOf(t) && !isAdmin() ? "Save TM hrs" : "Save reading";
  }
  const chk = $("d-chk"), c = tmCheck(t);
  if (chk && c) chk.replaceChildren(...checkRow(t, c));
  const stale = staleHrs(c);
  if (stale && (r.service || (r.oil && t.tm === "cds"))) res.append(h("p", { class: "stale", text: `These TM numbers are based on hours from ${fmtWhen(stale.toISOString())}. Enter today's TM hrs to update them.` }));
  $("d-meta").textContent = t.readingAt
    ? `Last saved reading: ${fmtWhen(t.readingAt)}${t.readingBy ? " by " + t.readingBy : ""}${drafts[id] && st.changed ? " · not saved yet" : ""}`
    : "No saved reading yet";
}

/** Details panel: where this truck stands on the week's TM hrs check, with "Not available this week". */
function checkRow(t, c) {
  const by = t.hrsBy ? ` by ${t.hrsBy}` : "";
  const last = c.last ? `Last entered ${fmtWhen(c.last.toISOString())}${by}.` : "No TM hrs entered in the app yet.";
  if (c.state === "done") return [h("span", { class: "flag ok", text: "TM hrs ✓" }), h("span", { text: ` Checked this week: ${fmtWhen(c.last.toISOString())}${by}.` })];
  if (c.state === "skipped") return [h("span", { class: "flag skip", text: "Not available this week" }), h("span", { text: " Skipped on this week's TM hrs check. " }),
    h("button", { class: "link", type: "button", id: "d-unskip", onclick: () => queueTmSkip(t.id, false), text: "Undo" })];
  const late = c.state === "missed" || c.weeks >= 1 || !c.last;
  return [h("span", { class: "flag " + (late ? "due" : "soon"), text: c.state === "today" ? "TM hrs due today" : "TM hrs missed this week" }),
    h("span", { text: ` ${last} Same hours? Tap Confirm TM hrs. ` }),
    h("button", { class: "btn small ghost", type: "button", id: "d-skip", onclick: () => queueTmSkip(t.id, true), text: "Not available this week" })];
}

/** The truck's One Step GPS details. Shown only; nothing here changes the oil or TM numbers. */

    g.codes.length ? [" · ", g.codes.map((c, i) => [i ? ", " : "", h("a", { class: "code-link", href: `https://www.google.com/search?q=${encodeURIComponent(c + " code " + (t.vehicle || ""))}`, target: "_blank", rel: "noopener", text: c })])] : null,

/** Admins: "Set as shop" on a parked truck, so every truck parked there shows "At shop" instead of the street. */
function shopButton(t, here) {
  const g = t.gps;
  if (!isAdmin() || apiLevel < 12 || g.offline || g.status === "Driving") return null;
  const shop = shopLoc();
  const [text, hint] = here ? ["Remove shop", "Trucks parked here show \u201cAt shop\u201d."]
    : shop ? ["Make this the shop", "The shop is set somewhere else."]
    : ["Set as shop", "Parked at the shop? Then trucks parked here show \u201cAt shop\u201d instead of the street."];
  return h("small", { class: "shop-row" }, hint + " ",
    h("button", { class: "link", type: "button", id: "d-shop", text, onclick: async e => {
      const b = e.currentTarget; b.disabled = true;
      try {
        const out = await api("setShop", here ? { clear: true } : { lat: g.lat, lng: g.lng });
        noteGps(Object.assign({}, gpsHealth, { shop: out.shop || null }));
        toast(here ? "Shop removed" : "Shop set. Trucks parked here show \u201cAt shop\u201d.");
        renderAll();
      } catch (ex) { toast(ex && ex.error === "offline" ? "No connection. Try again when you're back online." : errText(ex)); b.disabled = false; }
    } }));
}

/* ---------- service history ---------- */
const SVC_TYPES = ["Oil change", "TM service", "TM repair", "Tires", "Brakes", "Inspection", "Repair", "Other"];
const svcCache = {};                                        // truck id -> { loading, rows, error }
const svcView = { id: null, type: "", q: "", all: false };  // filters for the open truck
const isoDay = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s || ""));
function fmtDay(s) { if (!isoDay(s)) return "No date"; const [y, m, d] = s.split("-").map(Number); return `${MONTHS[m - 1]} ${d}, ${y}`; }
function todayIso() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function money(n) { return "$" + n.toLocaleString("en-US", { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 }); }
const svcTypes = r => String(r.type || "Other").split(/\s*,\s*/).filter(Boolean);
const svcSorted = rows => rows.slice().sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")) || String(b.updatedAt || "").localeCompare(String(a.updatedAt || "")));
/** A best guess at the type from the words, for new records saved without one ticked. */
function svcGuessType(what) {
  const s = String(what || "").toLowerCase(), out = [];
  if (/oil/.test(s) && !/truck-?\s?mount|\btm\b|blower|pump oil/.test(s)) out.push("Oil change");
  if (/truck-?\s?mount|\btm\b|\b(50|100|200|400|500|1000)\s*(hrs?|hours)\b/.test(s)) out.push("TM service");
  if (/tire|align/.test(s)) out.push("Tires");
  if (/brake|rotor|\bpads?\b/.test(s)) out.push("Brakes");
  if (/inspection|safety|emission/.test(s)) out.push("Inspection");
  return out.length ? out : ["Repair"];
}
function loadServices(id) {
  svcCache[id] = { loading: true, rows: [] };
  renderServices(id);
  api("services", { truckId: id }).then(out => {
    let rows = out.services || [];
    for (const j of queue) {   // changes still on their way stay on screen
      if (j.truckId !== id) continue;
      if (j.action === "deleteService") rows = rows.filter(x => x.id !== j.data.id);
      else if (j.action === "saveService") { const r = j.data.service; const old = rows.find(x => x.id === r.id); rows = old ? rows.map(x => x.id === r.id ? Object.assign({}, x, r, { check: "" }) : x) : rows.concat([Object.assign({ source: "App" }, r)]); }
    }
    svcCache[id] = { rows };
    renderServices(id);
  })
    .catch(e => { svcCache[id] = { error: e || {}, rows: [] }; renderServices(id); });
}
function serviceSection(t) {
  return h("div", { class: "dr-section", id: "d-svc" },
    h("div", { class: "svc-head" }, h("h3", { text: "Service history" }),
      h("div", { class: "svc-actions" },
        h("button", { class: "btn small", type: "button", id: "svc-csv", text: "Download", onclick: () => downloadServices(t.id) }),
        isAdmin() ? h("button", { class: "btn small primary", type: "button", id: "svc-add", text: "+ Add record", onclick: () => openServiceRecord(t.id, null) }) : null)),
    h("input", { type: "search", id: "svc-q", class: "svc-q", placeholder: "Search records (shop, part, miles…)", value: svcView.q, autocomplete: "off", "aria-label": "Search service records",
      oninput: e => { svcView.q = e.target.value; svcView.all = false; renderServices(t.id); } }),
    h("div", { id: "d-svc-body" }));
}
function svcFiltered(id) {
  const rows = svcSorted((svcCache[id] || {}).rows || []);
  const q = svcView.q.trim().toLowerCase();
  let list = rows;
  if (svcView.type === "check") list = list.filter(r => r.check);
  else if (svcView.type) list = list.filter(r => svcTypes(r).includes(svcView.type));
  if (q) list = list.filter(r => [r.what, r.shop, r.type, r.payment, r.date, fmtDay(r.date), r.miles, r.tmHrs, r.cost].join(" ").toLowerCase().includes(q));
  return { rows, list };
}
function renderServices(id) {
  const body = $("d-svc-body"); if (!body || openId !== id) return;
  const c = svcCache[id];
  if (!c || c.loading) { body.replaceChildren(h("p", { class: "meta", text: "Loading service history…" })); return; }
  if (c.error) {
    body.replaceChildren(h("p", { class: "meta", text: c.error.error === "bad_request" ? "Service history needs the updated Google script (see the yellow note at the top)." : "Service history couldn't load right now. Pull to refresh or reopen the truck." }));
    return;
  }
  const { rows, list } = svcFiltered(id);
  if (!rows.length) { body.replaceChildren(h("p", { class: "meta", text: isAdmin() ? "No service records yet. Logging an oil change or service adds one, or use + Add record." : "No service records yet." })); return; }
  const counts = {};
  rows.forEach(r => svcTypes(r).forEach(k => { counts[k] = (counts[k] || 0) + 1; }));
  const nCheck = rows.filter(r => r.check).length;
  const chip = (key, text) => h("button", { class: "chip-btn sm" + (key === "check" ? " warn-chip" : ""), type: "button", "aria-pressed": String(svcView.type === key),
    onclick: () => { svcView.type = svcView.type === key ? "" : key; svcView.all = false; renderServices(id); } }, text);
  const byYear = {};
  list.forEach(r => { if (isNum(r.cost) && isoDay(r.date)) { const y = r.date.slice(0, 4); byYear[y] = (byYear[y] || 0) + r.cost; } });
  const years = Object.keys(byYear).sort().reverse().slice(0, 3);
  const shown = svcView.all ? list : list.slice(0, 12);
  body.replaceChildren(...[
    h("div", { class: "chips svc-filters" }, chip("", `All ${rows.length}`), SVC_TYPES.filter(k => counts[k]).map(k => chip(k, `${k} ${counts[k]}`)),
      nCheck ? chip("check", `To check ${nCheck}`) : null),
    years.length ? h("p", { class: "meta", id: "svc-costs", text: "Costs on record: " + years.map(y => `${y} ${money(Math.round(byYear[y] * 100) / 100)}`).join(" · ") }) : null,
    list.length ? h("ul", { class: "svc-list", id: "svc-list" }, shown.map(r => svcItem(id, r))) : h("p", { class: "meta", text: "No records match." }),
    list.length > shown.length ? h("button", { class: "btn small", type: "button", id: "svc-more", text: `Show all ${list.length}`, onclick: () => { svcView.all = true; renderServices(id); } }) : null].filter(Boolean));
}
function svcItem(id, r) {
  const meta = [isNum(r.miles) ? `${fmt(r.miles)} mi` : null, isNum(r.tmHrs) ? `${fmt(r.tmHrs)} TM hrs` : null, r.shop || null].filter(Boolean).join(" · ");
  return h("li", null, h("button", { class: "svc-item" + (r.check ? " flagged" : ""), type: "button", "data-id": r.id, onclick: () => openServiceRecord(id, r) },
    h("span", { class: "svc-top" }, h("strong", { text: fmtDay(r.date) }), svcTypes(r).map(k => h("span", { class: "svc-tag", text: k })),
      isNum(r.cost) ? h("span", { class: "svc-cost", text: money(r.cost) }) : null),
    h("span", { class: "svc-what", text: r.what || "(nothing written)" }),
    meta ? h("span", { class: "svc-meta", text: meta }) : null,
    r.payment ? h("span", { class: "svc-meta", text: "Payment: " + r.payment }) : null,
    r.check ? h("span", { class: "svc-check", text: "Check: " + r.check }) : null));
}
function downloadServices(id) {
  const t = byId(id); if (!t) return;
  const c = svcCache[id];
  if (!c || c.loading || c.error) { toast("Service history isn't loaded yet."); return; }
  const { list } = svcFiltered(id);
  const lines = [["Date", "Type", "What was done", "Miles", "TM hrs", "Shop", "Cost", "Payment", "Check", "Source"]].concat(
    list.map(r => [r.date, r.type, r.what, isNum(r.miles) ? r.miles : "", isNum(r.tmHrs) ? r.tmHrs : "", r.shop, isNum(r.cost) ? r.cost : "", r.payment, r.check, r.source]));
  const name = String(t.unit || "truck").replace(/[^A-Za-z0-9]+/g, "-");
  downloadFile(`VODA-Service-${name}-${todayIso()}.csv`, "\ufeff" + lines.map(row => row.map(csvCell).join(",")).join("\r\n"), "text/csv;charset=utf-8");
  toast(`Downloaded ${list.length} service record${list.length === 1 ? "" : "s"}.`);
}

function loadHistory(id) {
  historyCache[id] = { loading: true, rows: [] };
  renderHistory(id);
  api("history", { id }).then(out => { historyCache[id] = { rows: out.entries || [] }; renderHistory(id); })
    .catch(() => { historyCache[id] = { error: true, rows: [] }; renderHistory(id); });
}
function renderHistory(id) {
  const ul = $("d-hist"); if (!ul || openId !== id) return;
  const c = historyCache[id];
  if (!c || c.loading) { ul.replaceChildren(h("li", null, h("small", { text: "Loading history…" }))); return; }
  if (c.error) { ul.replaceChildren(h("li", null, h("small", { text: "History couldn't load right now." }))); return; }
  if (!c.rows.length) { ul.replaceChildren(h("li", null, h("small", { text: "No history yet." }))); return; }
  ul.replaceChildren(...c.rows.slice(0, 10).map((x, i) => histEntry(c.rows, i)));
}
/** One line of a truck's history (newest first). A reading says what changed, e.g. "TM hrs 2,756 → 2,757".
 *  Lines saved before the script said so get the TM hrs before from the older line under them. */
const SAYS_CHANGE = /→| set to |^No change$| confirmed at /;

  const x = rows[i], items = Array.isArray(x.items) ? x.items : [];

/* ---------- what happens when a background save comes back ---------- */
/** Later changes to the same truck or record now build on what the sheet just confirmed. */

}

    for (const j of pendingFor(job.key)) t = Object.assign(overlay(t, j.data.truck), { id: t.id, updatedAt: t.updatedAt });
    const cur = byId(t.id);
    if (cur && String(cur.tmSkip || "") !== String(t.tmSkip || "") && queue.some(j => j.action === "tmSkip" && j.data.id === t.id)) t.tmSkip = cur.tmSkip;
    replaceTruck(t);
    const id = job.data.id, log = job.data.log;
    delete historyCache[id];
    if (openId === id && drawer.open) loadHistory(id);
    if (job.data.truck.color && out.truck.color === undefined) setBanner(SCRIPT_OLD);   // an old script drops the color
    if (log && log.kind === "service") { delete svcCache[id]; if (openId === id && drawer.open) loadServices(id); }
  } else if (job.action === "saveService" && out && out.service) {
    rebase(job.key, out.service.updatedAt);
    const c = svcCache[job.truckId];
    if (c && c.rows) {
      let r = out.service;
      for (const j of pendingFor(job.key)) if (j.action === "saveService") r = Object.assign({}, r, j.data.service, { updatedAt: r.updatedAt, check: "" });
      const gone = pendingFor(job.key).some(j => j.action === "deleteService");
      c.rows = gone ? c.rows.filter(x => x.id !== r.id) : c.rows.some(x => x.id === r.id) ? c.rows.map(x => x.id === r.id ? r : x) : c.rows.concat([r]);
      renderServices(job.truckId);
    }
  } else if (job.action === "deleteService") {
    delete knownBase[job.key];
  } else if (job.action === "supplyReport" && out) {
    noteSupplies(out.supplies);
    if (Array.isArray(out.already) && out.already.length) {
      job.okMsg = `${out.already.join(", ")}: already on the order list, so left as it was. Only an admin can change ${out.already.length === 1 ? "it" : "them"}.`;
    }
  } else if (job.action === "tmSkip" && out && out.truck) {
    const cur = byId(job.data.id);
    if (cur && !pendingFor(job.key).length) replaceTruck(Object.assign({}, cur, { tmSkip: out.truck.tmSkip || "" }));
    delete historyCache[job.data.id];
    if (openId === job.data.id && drawer.open) loadHistory(job.data.id);
  }

  renderAll();
}
let failNote = "";

  let msg;

    const id = job.data.id;
    if (e.error === "conflict" && e.truck) {
      knownBase[job.key] = e.truck.updatedAt;
      queue = queue.filter(j => j.key !== job.key); saveQueue();   // later changes were based on the old copy too
      replaceTruck(e.truck);
      for (const j of [job].concat(dropped)) if (j.restore) { drafts[id] = j.restore; saveDrafts(); }
      msg = `Someone else just updated ${label(e.truck)}. Your change wasn't saved; the latest numbers are loaded` +

    } else {

      if (job.restore) { drafts[id] = job.restore; saveDrafts(); }
      msg = e.error === "duplicate_unit" ? `"${e.unit || job.data.truck.unit}" is already used by another truck, so ${job.label} wasn't saved. Pick a different name.`
        : e.error === "gone" ? `${job.label} was deleted on another phone, so the change wasn't saved.`
        : `${job.label}: not saved. ${errText(e, "Nothing")}`;
      refresh(true);
    }
  } else if (job.action === "supplyReport") {
    queue = queue.filter(j => j.key !== job.key); saveQueue();
    supRestoreDraft(job);
    msg = (e.error === "bad_request" ? "The checklist wasn't sent: the Google script needs updating (see the note at the top)."
      : e.error === "not_allowed" || e.error === "gone" ? "The checklist wasn't sent: you no longer have that checklist."
      : `The checklist wasn't sent. ${errText(e, "Your marks")}`) + (e.error === "not_allowed" || e.error === "gone" ? "" : " Your marks are back on the checklist.");
  } else if (job.action === "tmSkip") {

    msg = e.error === "gone" ? `${job.label} was deleted on another phone.` : `${job.label}: "not available" wasn't saved. ${errText(e, "Nothing")}`;

      : e.error === "gone" ? "That service record was deleted on another phone."
      : `Service record not saved. ${errText(e, "Nothing")}`;

/* ---------- saving a reading ---------- */
async function saveReading(id) {
  const t = byId(id); if (!t) return;
  const v = currentValues(t);
  const prog = progOf(t);
  if (Number.isNaN(v.miles) || Number.isNaN(v.hrs) || (isAdmin() && !isNum(v.miles))) return;
  const st = saveState(t, v);
  if (!st.changed && !st.confirm) return;
  const body = plain(t);
  body.milesNow = isAdmin() ? v.miles : t.milesNow;
  if (prog && isNum(v.hrs)) body.hrsNow = v.hrs;
  body.readingAt = new Date().toISOString();
  body.readingBy = session ? session.name : "";
  if (prog && isNum(v.hrs) && (v.hrs !== t.hrsNow || st.confirm)) { body.hrsAt = body.readingAt; body.hrsBy = body.readingBy; }   // counts for the Tuesday check
  const restore = { miles: v.milesStr, hrs: v.hrsStr };
  delete drafts[id]; saveDrafts();
  const log = { kind: "reading", miles: body.milesNow, hrs: prog && isNum(v.hrs) ? v.hrs : null, items: st.confirm ? ["TM hrs confirmed (no change)"] : [] };
  if (st.confirm) log.hrsChecked = true;
  try { saveTruck(t, body, log, st.confirm ? `TM hrs confirmed for ${label(t)}` : `Saved ${label(t)}`, restore); }
  catch (e) { drafts[id] = restore; saveDrafts(); toast(failText(e, "Your numbers")); }
  renderAll();

          if (level) {
            body.tiers = Object.assign({}, body.tiers || {});
            for (const hh of servicesCovered(t, level, hrs)) body.tiers[String(hh)] = hrs;
            done.push(`TM ${level}-hr service`);
          }
          if (!isNum(body.milesNow) || miles >= body.milesNow) body.milesNow = miles;
          if (prog && isNum(hrs) && (!isNum(body.hrsNow) || hrs >= body.hrsNow)) body.hrsNow = hrs;
          body.readingAt = new Date().toISOString();
          body.readingBy = session ? session.name : "";
          // A TM service (or new hours) counts for the Tuesday TM hrs check
          const hrsChecked = !!prog && isNum(hrs) && (hrs !== t.hrsNow || done.some(x => /^TM /.test(x)));
          if (hrsChecked) { body.hrsAt = body.readingAt; body.hrsBy = body.readingBy; }
          try {
            saveTruck(t, body, { kind: "service", miles, hrs: prog ? hrs : null, items: done, note: val("sv-note").slice(0, 500),
              shop: val("sv-shop").slice(0, 60), cost: isNum(cost) ? cost : null, hrsChecked }, `Logged for ${label(t)}: ${done.join(", ")}`);
            delete drafts[t.id]; saveDrafts();
            closeDialog();
            renderAll();
          } catch (e) { err.textContent = failText(e, "Nothing"); }
        } }))));
}

/** What an edit changed, for the truck's history: name, plate, unit, driver and color by name, anything else as "Truck details edited". */
function editItems(t, body) {
  const s = v => v == null ? "" : typeof v === "object" ? JSON.stringify(Object.keys(v).sort().map(k => [k, v[k]])) : String(v);
  const was = k => s(t[k]);
  const items = [];
  if (s(body.unit) !== was("unit")) items.push(`Renamed from ${t.unit || "(no name)"} to ${body.unit}`);
  if (s(body.plate) !== was("plate")) items.push(`Plate set to ${body.plate || "(none)"}`);
  if (s(body.division) !== was("division")) items.push(`Unit set to ${body.division || "(none)"}`);
  if (s(body.driver) !== was("driver")) items.push(`Driver changed from ${t.driver || "(none)"} to ${body.driver || "(none)"}`);
  if (s(body.color) !== was("color")) items.push(body.color ? "Color changed" : "Color removed");
  const named = ["unit", "plate", "division", "driver", "color"];
  if (Object.keys(body).some(k => !named.includes(k) && s(body[k]) !== was(k))) items.push("Truck details edited");
  return items;
}

  const d = new Date();
  const lines = [`VODA fleet maintenance · ${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`];
  const groups = { due: [], soon: [], gps: [] };
  const paper = [];

/** ", closed Thu, Nov 26 (Thanksgiving)" for a closed day still ahead this month on a Monday to Saturday. */
function lbClosedText(key, today) {
  const out = [];
  for (let d = 1; d <= lbDaysIn(key); d++) {
    const day = `${key}-${String(d).padStart(2, "0")}`, hol = lbHoliday(day);

}

  });
})();

/* ---------- install as an app ---------- */
const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
let installEvt = null;
function renderInstall() {
  const bar = $("installbar");
  if (isStandalone() || store.get(K_INSTALL)) { bar.hidden = true; return; }
  if (installEvt) {
    $("installText").textContent = "Install VODA Prime on this phone so it opens like an app.";
    $("installBtn").hidden = false; bar.hidden = false;
  } else if (isIOS) {
    $("installText").textContent = "To install on iPhone: tap the Share button (square with an arrow), then Add to Home Screen.";
    $("installBtn").hidden = true; $("installDismiss").textContent = "Got it"; bar.hidden = false;
  } else bar.hidden = true;
}
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; renderInstall(); });
window.addEventListener("appinstalled", () => { installEvt = null; $("installbar").hidden = true; toast("VODA Prime installed. Open it from your home screen."); });
$("installBtn").addEventListener("click", async () => {
  if (!installEvt) return;
  installEvt.prompt();
  try { await installEvt.userChoice; } catch (e) {}
  installEvt = null; renderInstall();
});
$("installDismiss").addEventListener("click", () => { store.set(K_INSTALL, true); $("installbar").hidden = true; });

/* ---------- start ---------- */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && session && CONFIGURED) refresh(true); });
window.addEventListener("online", () => { if (session && CONFIGURED) { refresh(true); pump(); } });
setInterval(() => { if (document.visibilityState === "visible" && session && CONFIGURED && !dlg.open) refresh(true); }, 90000);

renderInstall();
if (/^#order-list(\/|$)/.test(location.hash)) {   // the link in the checklist email
  view.tab = "supplies"; view.supTab = "orders"; view.list = decodeURIComponent(location.hash.slice(12)) || view.list; saveView();
}
else if (location.hash === "#supplies") { view.tab = "supplies"; saveView(); }
else if (location.hash === "#leaderboard") { view.tab = "leaderboard"; saveView(); }
else if (location.hash === "#office") { view.tab = "office"; saveView(); }
if (!CONFIGURED) showNotConfigured();
else if (!session) showSignIn("");
else {
  const cache = store.get(K_CACHE);
  if (cache && Array.isArray(cache.trucks)) { trucks = sortTrucks(cache.trucks); lastSync = new Date(cache.at); loaded = true; }
  startApp();
}

</script>
</body>
</html>
