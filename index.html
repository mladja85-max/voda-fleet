<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VODA Fleet</title>
<meta name="description" content="Oil changes and truckmount service for the VODA trucks.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VODA Fleet">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121a23" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root {
  /* Layout: sticky top bar; summary tiles that filter; toolbar; a responsive grid of truck tiles (inline entry);
     an attention sidebar on wide screens; a details panel that slides in from the right. */
  --bg: #eef1f5;
  --surface: #ffffff;
  --surface-2: #f6f8fa;
  --ink: #111a24;
  --muted: #5a6879;
  --line: #e0e6ed;
  --accent: #1f4fbf;
  --accent-ink: #ffffff;
  --accent-soft: #e7eefc;
  --clean: #0f766e;
  --clean-bg: #dcf3ef;
  --ok: #17803d;
  --ok-bg: #e2f3e7;
  --soon: #985a05;
  --soon-bg: #fcefd3;
  --due: #c0281a;
  --due-bg: #fde6e3;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 2px 10px rgba(16, 24, 40, .06);
  --radius: 14px;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1117; --surface: #151d27; --surface-2: #19222d; --ink: #e7ecf2; --muted: #9babbc; --line: #273241;
    --accent: #7ea6ff; --accent-ink: #0b1320; --accent-soft: #1b2a45; --clean: #4fd1c0; --clean-bg: #12302c;
    --ok: #55c57f; --ok-bg: #12301f; --soon: #f0b54d; --soon-bg: #372a10; --due: #ff8072; --due-bg: #3d1814;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1117; --surface: #151d27; --surface-2: #19222d; --ink: #e7ecf2; --muted: #9babbc; --line: #273241;
  --accent: #7ea6ff; --accent-ink: #0b1320; --accent-soft: #1b2a45; --clean: #4fd1c0; --clean-bg: #12302c;
  --ok: #55c57f; --ok-bg: #12301f; --soon: #f0b54d; --soon-bg: #372a10; --due: #ff8072; --due-bg: #3d1814;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.4; -webkit-text-size-adjust: 100%; }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }

/* ---- top bar ---- */
.topbar {
  position: sticky; top: 0; z-index: 30; display: flex; align-items: center; flex-wrap: wrap; gap: 10px 18px;
  padding: 10px 24px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand svg { width: 30px; height: 30px; flex: none; }
.brand h1 { font-family: var(--font-display); font-size: 1.45rem; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; }
.sync { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: .88rem; font-variant-numeric: tabular-nums; }
.sync.offline { color: var(--soon); font-weight: 600; }
.sync.saving { color: var(--accent); font-weight: 600; }
.kpi.tmchk::after { background: var(--soon); }
.kpi.tmchk .num { color: var(--soon); }
.kpi.tmchk.missed::after { background: var(--due); }
.kpi.tmchk.missed .num { color: var(--due); }
.kpi.tmchk.clear::after { background: var(--ok); }
.kpi.tmchk.clear .num { color: var(--ok); }
.flag.ok { background: var(--ok-bg); color: var(--ok); }
.flag.skip { background: var(--line); color: var(--muted); }
.tile-chk { margin: 0; padding: 0 14px 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .8rem; }
.tile-chk:empty { display: none; }
.stale { margin: 2px 0 0; font-size: .76rem; color: var(--muted); font-style: italic; }
.tmcheck { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-top: 12px; padding: 10px 14px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--soon); }
.tmcheck[hidden] { display: none; }
.tmcheck.due { border-left-color: var(--due); }
.tmcheck.ok { border-left-color: var(--ok); }
.tc-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.tc-count { color: var(--muted); font-size: .88rem; font-variant-numeric: tabular-nums; }
.tc-left { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.tc-lbl { font-size: .82rem; font-weight: 700; color: var(--muted); }
.tc-truck { font: inherit; font-size: .8rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; border: 0; cursor: pointer; }
.tc-truck.due { background: var(--due-bg); color: var(--due); }
.tc-truck.soon { background: var(--soon-bg); color: var(--soon); }
.tc-done { color: var(--ok); font-weight: 700; font-size: .9rem; }
.tc-hint { flex-basis: 100%; margin: 0; font-size: .82rem; color: var(--muted); }
.tc-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: .88rem; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; }
.gps-warn { all: unset; cursor: pointer; font-weight: 700; font-size: .82rem; color: var(--soon); background: var(--soon-bg); padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.gps-warn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.top-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600; font-size: .92rem;
  padding: 8px 13px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; white-space: nowrap;
}
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); }
.btn.danger { color: var(--due); }
.btn.small { padding: 6px 10px; font-size: .85rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn svg, .icon-btn svg { width: 17px; height: 17px; flex: none; }
.icon-btn { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; color: var(--ink); }
.icon-btn:hover { border-color: var(--accent); }
.btn:focus-visible, .icon-btn:focus-visible, .kpi:focus-visible, .tile-head:focus-visible, .chip-btn:focus-visible, .attn-btn:focus-visible, summary:focus-visible {
  outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px;
}
.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---- page ---- */
.page { padding: 18px 24px 48px; display: grid; gap: 16px; }
.banner { border-radius: 12px; padding: 11px 14px; font-weight: 500; background: var(--soon-bg); border: 1px solid var(--line); }
.banner:empty { display: none; }
.installbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; background: var(--surface); border: 1.5px solid var(--accent); border-radius: 12px; padding: 10px 14px; }
.installbar p { margin: 0; flex: 1 1 240px; }

.kpis { display: grid; grid-template-columns: repeat(var(--kpis, 5), minmax(0, 1fr)); gap: 12px; }
.kpi {
  text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 12px 16px; display: grid; gap: 2px; align-content: start; cursor: pointer; position: relative; overflow: hidden;
}
.kpi::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--line); }
.kpi.due::after { background: var(--due); }
.kpi.soon::after { background: var(--soon); }
.kpi.ok::after { background: var(--ok); }
.kpi.paper::after { background: var(--muted); }
.kpi.all::after { background: var(--accent); }
.kpi.engine::after { background: var(--due); }
.kpi.doc.due::after { background: var(--due); }
.kpi.doc.due .num { color: var(--due); }
.kpi.doc.soon::after { background: var(--soon); }
.kpi.doc.soon .num { color: var(--soon); }
.kpi.doc.clear::after { background: var(--ok); }
.kpi.doc.clear .num { color: var(--ok); }
.kpi.engine .num { color: var(--due); }
.kpi .num { font-family: var(--font-display); font-size: 2.1rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi.due .num { color: var(--due); }
.kpi.soon .num { color: var(--soon); }
.kpi.ok .num { color: var(--ok); }
.kpi .lbl { color: var(--muted); font-weight: 700; font-size: .76rem; text-transform: uppercase; letter-spacing: .06em; }
.kpi .lbl .short { display: none; }
@media (max-width: 1279px) { .kpi .lbl .long { display: none; } .kpi .lbl .short { display: inline; } }
.kpi[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent), var(--shadow); }

.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.search { position: relative; flex: 1 1 260px; max-width: 420px; }
.search svg { position: absolute; left: 11px; top: 50%; width: 17px; height: 17px; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search input { width: 100%; font: inherit; padding: 9px 12px 9px 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.chip-btn { padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: .88rem; cursor: pointer; }
.chip-btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.sortsel { font: inherit; font-weight: 600; font-size: .88rem; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.toolbar .count { color: var(--muted); font-size: .88rem; margin-left: auto; font-variant-numeric: tabular-nums; }
.filt-btn { display: none; align-items: center; gap: 6px; white-space: nowrap; }
.filt-btn[aria-pressed="true"], .toolbar.open .filt-btn { border-color: var(--accent); color: var(--accent); }
.filt-btn .n { background: var(--accent); color: var(--accent-ink); border-radius: 999px; font-size: .72rem; padding: 0 6px; line-height: 1.5; }

.layout { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 1280px) {
  .layout { grid-template-columns: minmax(0, 1fr) 320px; }
  .aside { position: sticky; top: 74px; max-height: calc(100vh - 90px); overflow: auto; }
  .how-bottom { display: none; }
}
@media (max-width: 1279px) { .aside { display: none; } }

/* ---- truck tiles ---- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(275px, 1fr)); gap: 14px; align-items: start; }
.tile {
  background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
  display: flex; flex-direction: column; overflow: hidden; position: relative; scroll-margin-top: 80px;
}
.tile::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--line); }
.tile[data-status="due"]::before { background: var(--due); }
.tile[data-status="soon"]::before { background: var(--soon); }
.tile[data-status="ok"]::before { background: var(--ok); }
.tile.flash { box-shadow: 0 0 0 3px var(--accent), var(--shadow); }
.tile { cursor: pointer; }
.tile input:not([readonly]) { cursor: text; }
.tile-head { all: unset; box-sizing: border-box; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; padding: 14px 14px 0; cursor: pointer; }
.tile-title { display: flex; align-items: center; gap: 6px 8px; flex-wrap: wrap; min-width: 0; }
.plate { font-weight: 700; font-size: .8rem; letter-spacing: .07em; padding: 1px 6px; border: 1.5px solid var(--muted); border-radius: 5px; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.div-chip { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.div-chip.cleaning { background: var(--clean-bg); color: var(--clean); }
.div-chip.restoration { background: var(--accent-soft); color: var(--accent); }
.div-chip.none { color: var(--muted); border: 1px dashed var(--line); }
#grid.split .tile-title .div-chip { display: none; }
.tile-foot .miles { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
.grp { grid-column: 1 / -1; display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; margin-top: 10px; padding: 0 2px 7px; border-bottom: 3px solid var(--line); }
.grp:first-child { margin-top: 0; }
.grp-name { font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; text-transform: uppercase; letter-spacing: .04em; line-height: 1.1; }
.grp.restoration { border-bottom-color: var(--accent); }
.grp.restoration .grp-name { color: var(--accent); }
.grp.cleaning { border-bottom-color: var(--clean); }
.grp.cleaning .grp-name { color: var(--clean); }
.grp.none .grp-name { color: var(--muted); }
.grp-count { color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }
.grp-stats { display: inline-flex; gap: 6px; }
.grp-stat { font-size: .74rem; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.grp-stat.due { background: var(--due-bg); color: var(--due); }
.grp-stat.soon { background: var(--soon-bg); color: var(--soon); }
.grp-stat.ok { background: var(--ok-bg); color: var(--ok); }
.grp-hint { color: var(--muted); font-size: .8rem; }
.unit { font-family: var(--font-display); font-weight: 700; font-size: 1.45rem; text-transform: uppercase; letter-spacing: .02em; line-height: 1.05; }
.driver { color: var(--muted); font-weight: 600; }
.tile-sub { margin: 3px 0 0; padding: 0 14px; color: var(--muted); font-size: .84rem; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tag { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); background: var(--accent-soft); padding: 2px 7px; border-radius: 6px; }
.pill { padding: 3px 10px; border-radius: 999px; font-weight: 700; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.pill.due { background: var(--due-bg); color: var(--due); }
.pill.soon { background: var(--soon-bg); color: var(--soon); }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.metrics { padding: 12px 14px; display: grid; gap: 10px; flex: 1; align-content: start; }
.metric { display: grid; gap: 4px; }
.metric-line { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.metric-label { font-size: .74rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.metric-value { font-weight: 700; font-variant-numeric: tabular-nums; }
.metric.due .metric-value { color: var(--due); }
.metric.soon .metric-value { color: var(--soon); }
.metric.ok .metric-value { color: var(--ok); }
.meter { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; }
.meter > span { display: block; height: 100%; background: var(--ok); border-radius: 3px; }
.metric.soon .meter > span, .drow.soon .meter > span { background: var(--soon); }
.metric.due .meter > span, .drow.due .meter > span { background: var(--due); }
.no-reading { margin: 0; color: var(--muted); }
.quick { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); background: var(--surface-2); align-items: end; }
.quick.no-tm { grid-template-columns: minmax(0, 1fr) auto; }
.qf label { display: block; font-size: .7rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 3px; }
.qf input, .df input {
  width: 100%; font: inherit; font-weight: 700; font-size: 1.05rem; padding: 7px 9px; border-radius: 9px; border: 1.5px solid var(--line);
  background: var(--surface); color: var(--ink); font-variant-numeric: tabular-nums;
}
.qf input:focus, .df input:focus, .field input:focus, .field select:focus, .field textarea:focus, .search input:focus {
  outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
}
.qf .gps { font-size: .66rem; color: var(--accent); margin-left: 4px; }
.qf input.locked, .df input.locked { background: transparent; border-style: dashed; color: var(--muted); }
.quick.view-only { grid-template-columns: minmax(0, 1fr); }
.user-row { display: grid; gap: 6px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.user-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.user-top strong { font-size: 1rem; }
.user-meta { color: var(--muted); font-size: .84rem; }
.user-acts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.user-acts select { font: inherit; font-size: .88rem; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.code-box { display: grid; gap: 8px; padding: 12px; border-radius: 10px; border: 1.5px solid var(--accent); background: var(--accent-soft); }
.code-box .code { font-family: var(--font-display); font-size: 1.8rem; font-weight: 700; letter-spacing: .08em; color: var(--ink); }
.warn { margin: 0; padding: 0 14px 8px; background: var(--surface-2); color: var(--soon); font-weight: 600; font-size: .82rem; }
.warn:empty { display: none; }
.tile-foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 8px; padding: 0 14px 10px; font-size: .8rem; color: var(--muted); background: var(--surface-2); }
.tile-foot .left { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
.paper-badge { font-weight: 700; color: var(--due); background: var(--due-bg); padding: 1px 7px; border-radius: 999px; }
.paper-badge.soon { color: var(--soon); background: var(--soon-bg); }
.link { all: unset; cursor: pointer; color: var(--accent); font-weight: 700; }
.link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
/* GPS line on a tile: alerts, then status · place · fuel */
.tile-gps { margin: 0; padding: 0 14px 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .8rem; color: var(--muted); }
.tile-gps:empty { display: none; }
.gps-txt { min-width: 0; flex: 1 1 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.flag { font-weight: 700; font-size: .72rem; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.flag.due { background: var(--due-bg); color: var(--due); }
.flag.soon { background: var(--soon-bg); color: var(--soon); }
/* A truck's own color: its name in that color and a stripe down the left edge. The tile stays white. */
.tile.colored::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--truck); pointer-events: none; }
.colored .unit { color: var(--truck-text); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .colored .unit { color: var(--truck-text-dark); } }
:root[data-theme="dark"] .colored .unit { color: var(--truck-text-dark); }
.empty-grid { grid-column: 1 / -1; background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); padding: 28px; text-align: center; color: var(--muted); }

/* ---- sidebar ---- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; display: grid; gap: 8px; }
.panel + .panel { margin-top: 14px; }
.panel h2 { font-family: var(--font-display); font-size: 1.15rem; text-transform: uppercase; letter-spacing: .04em; }
.attn-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.attn-btn { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 10px 1fr; gap: 2px 10px; width: 100%; padding: 7px 8px; border-radius: 8px; cursor: pointer; }
.attn-btn:hover { background: var(--surface-2); }
.attn-btn strong { font-weight: 700; }
.attn-btn span.txt { grid-column: 2; color: var(--muted); font-size: .86rem; font-variant-numeric: tabular-nums; }
.dot { width: 10px; height: 10px; border-radius: 50%; align-self: center; }
.dot.due { background: var(--due); } .dot.soon { background: var(--soon); } .dot.ok { background: var(--ok); }
details.paperwork summary, details.how summary { cursor: pointer; font-weight: 700; color: var(--accent); }
.how ul { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 4px; color: var(--muted); font-size: .88rem; }
.empty-ok { margin: 0; color: var(--ok); font-weight: 600; }

/* ---- details panel ---- */
dialog.drawer {
  margin: 0 0 0 auto; width: min(560px, 100vw); height: 100dvh; max-height: 100dvh; max-width: 100vw; border: none; border-left: 1px solid var(--line);
  border-radius: 0; padding: 0; background: var(--surface); color: var(--ink); overflow: auto;
}
dialog.drawer::backdrop { background: rgba(8, 12, 18, .45); }
.dr-top { position: sticky; top: 0; z-index: 2; background: var(--surface); border-bottom: 1px solid var(--line); }
.dr-head { padding: 10px 12px 7px 16px; background: var(--surface); }
.dr-tabs { display: flex; gap: 2px; padding: 0 12px; overflow-x: auto; scrollbar-width: none; }
.dr-tabs::-webkit-scrollbar { display: none; }
.dr-tab { all: unset; box-sizing: border-box; cursor: pointer; padding: 9px 10px 8px; font-weight: 700; font-size: .88rem; color: var(--muted); white-space: nowrap; border-bottom: 3px solid transparent; }
.dr-tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.dr-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 6px; }
.tab-panel[hidden] { display: none !important; }
.dr-head .titles { flex: 1; min-width: 0; }
.title-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.icon-btn.sm { width: 30px; height: 30px; border-radius: 8px; flex: none; }
.icon-btn.sm svg { width: 15px; height: 15px; }
.rename { display: grid; gap: 8px; }
.rn-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.rn-fields label { display: block; font-size: .74rem; font-weight: 700; color: var(--muted); margin-bottom: 3px; text-transform: uppercase; letter-spacing: .05em; }
.rn-fields input, .rn-fields select { width: 100%; font: inherit; font-weight: 700; font-size: 1.05rem; padding: 8px 10px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--surface-2); color: var(--ink); }
.rn-fields input:focus, .rn-fields select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.rn-actions { display: flex; gap: 8px; }
.dr-head .unit { font-size: 1.4rem; }
.dr-head .tile-title { margin: 0 auto 0 0; font-size: inherit; flex-wrap: nowrap; min-width: 0; }
.dr-head .tile-title .unit { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dr-head .title-row .pill { flex: none; }
.dr-sub { padding: 0; margin-top: 3px; font-size: .8rem; gap: 4px 6px; }
.dr-sub .div-chip { font-size: .62rem; padding: 2px 7px; }
.dr-sub .tag { font-size: .64rem; padding: 1px 6px; }
.dr-edit { flex: none; gap: 5px; padding-inline: 10px; }
.dr-edit svg { width: 14px; height: 14px; }
.shop-row { display: block; margin-top: 4px; color: var(--muted); }
.at-shop { color: var(--ok); }
.dr-body { padding: 16px 18px 28px; display: grid; gap: 14px; }
.dfields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.df label { display: block; font-size: .78rem; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
.df input { font-size: 1.3rem; padding: 10px 12px; }
.drow { display: grid; gap: 5px; padding: 11px 13px; border-radius: 11px; background: var(--surface-2); border: 1px solid var(--line); }
.drow .metric-value { font-size: 1.08rem; }
.drow.due .metric-value { color: var(--due); } .drow.soon .metric-value { color: var(--soon); } .drow.ok .metric-value { color: var(--ok); }
.drow-detail { margin: 0; color: var(--muted); font-size: .86rem; font-variant-numeric: tabular-nums; }
details.tasks summary { cursor: pointer; font-weight: 700; color: var(--accent); font-size: .9rem; }
details.tasks h4 { margin: 10px 0 4px; font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
details.tasks ul { margin: 0; padding-left: 20px; display: grid; gap: 3px; font-size: .92rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips:empty { display: none; }
.chip { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px; font-weight: 600; font-size: .82rem; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.chip.due { background: var(--due-bg); color: var(--due); border-color: transparent; }
.chip.soon { background: var(--soon-bg); color: var(--soon); border-color: transparent; }
.dr-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.dr-section h3 { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }
.meta { margin: 0; color: var(--muted); font-size: .86rem; }
.dr-head.colored { border-top: 6px solid var(--truck); }
.gps-list { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; padding: 11px 13px; border-radius: 11px; background: var(--surface-2); border: 1px solid var(--line); font-size: .92rem; }
.gps-list dt { color: var(--muted); font-weight: 700; font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; padding-top: 2px; }
.gps-list dd { margin: 0; min-width: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.gps-list .bad { color: var(--due); font-weight: 700; }
.gps-list .warnc { color: var(--soon); font-weight: 700; }
.gps-list small { display: block; color: var(--muted); }
.code-link { color: var(--due); font-weight: 700; }
/* service history */
.svc-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.svc-head h3 { margin: 0; }
.svc-actions { display: flex; gap: 6px; }
.svc-q { width: 100%; font: inherit; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); margin-bottom: 8px; }
.svc-q:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.svc-filters { margin-bottom: 6px; }
.chip-btn.sm { padding: 4px 10px; font-size: .8rem; }
.chip-btn.warn-chip { color: var(--soon); border-color: var(--soon); }
.svc-list { list-style: none; margin: 8px 0; padding: 0; display: grid; gap: 6px; }
.svc-item { all: unset; box-sizing: border-box; display: grid; gap: 3px; width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; }
.svc-item:hover { border-color: var(--accent); }
.svc-item:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }
.svc-item.flagged { border-color: var(--soon); }
.svc-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.svc-tag { font-size: .66rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 2px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.svc-cost { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; }
.svc-what { white-space: pre-line; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.svc-meta { color: var(--muted); font-size: .84rem; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.svc-check { color: var(--soon); font-weight: 700; font-size: .84rem; }
.dlg .svc-flag { padding: 9px 12px; border-radius: 10px; background: var(--soon-bg); color: var(--soon); font-weight: 600; }
.svc-typegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 6px 10px; }
/* color picker */
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { all: unset; box-sizing: border-box; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; border: 2px solid rgba(0, 0, 0, .14); position: relative; display: grid; place-items: center; }
.sw.none { background: var(--surface); border: 2px dashed var(--muted); }
.sw.none::after { content: ""; width: 70%; height: 2px; background: var(--muted); transform: rotate(-45deg); }
.sw[aria-checked="true"], .sw-more.on { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink); }
.sw:focus-visible, .sw-more:focus-within { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 3px; }
.sw-more { background: conic-gradient(#e11d48, #f59e0b, #84cc16, #06b6d4, #3b82f6, #a855f7, #e11d48); }
.sw-more input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
.sw-more span { font-weight: 800; font-size: 1.1rem; color: #fff; text-shadow: 0 0 3px #000; pointer-events: none; }
.rn-color { grid-column: 1 / -1; }

/* ---- forms and dialogs (log service, edit, settings) ---- */
dialog#dlg { border: 1px solid var(--line); border-radius: 16px; padding: 0; width: min(600px, calc(100% - 24px)); max-height: calc(100% - 24px); overflow: auto; background: var(--surface); color: var(--ink); }
dialog#dlg::backdrop { background: rgba(8, 12, 18, .55); }
.dlg { padding: 18px; display: grid; gap: 14px; }
.dlg:focus { outline: none; }
.dlg h3 { font-family: var(--font-display); font-size: 1.5rem; text-transform: uppercase; letter-spacing: .02em; }
.dlg p { margin: 0; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.field { display: grid; gap: 4px; }
.field label { font-weight: 600; font-size: .85rem; color: var(--muted); }
.field input, .field select, .field textarea { width: 100%; font: inherit; color: var(--ink); background: var(--surface-2); border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 12px; }
.field .hint, .hint { font-size: .8rem; color: var(--muted); }
fieldset { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 0; display: grid; gap: 8px; }
legend { font-weight: 700; font-size: .85rem; color: var(--muted); padding: 0 4px; }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.check input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--accent); flex: none; }
.check small { display: block; color: var(--muted); }
.dlg-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; }
.dlg-foot .right { display: flex; gap: 8px; margin-left: auto; }
.dlg-err { margin: 0; color: var(--due); font-weight: 600; }
.dlg-err:empty { display: none; }
.history { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: .9rem; }
.history li { padding: 6px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.history small { color: var(--muted); }
textarea.report { width: 100%; min-height: 220px; font: inherit; font-size: .9rem; padding: 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface-2); color: var(--ink); }

/* ---- sign-in ---- */
.gate { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 22px; display: grid; gap: 14px; width: min(460px, 100%); margin: 40px auto; }
.gate h2 { font-family: var(--font-display); font-size: 1.6rem; text-transform: uppercase; letter-spacing: .02em; }
.gate p { margin: 0; color: var(--muted); }
.gate .field input { font-size: 1.2rem; font-weight: 600; }
.gate code { font-size: .9em; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; }
.loading { color: var(--muted); padding: 24px 4px; }

.toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 10px; font-weight: 600; box-shadow: 0 6px 24px rgba(0, 0, 0, .25); max-width: calc(100% - 32px); }

/* ---- small screens ---- */
@media (max-width: 760px) {
  .topbar { padding: 10px 14px; }
  .page { padding: 14px 14px 40px; }
  .kpis { grid-template-columns: repeat(var(--kpis-phone, 4), minmax(0, 1fr)); gap: 8px; }
  .kpi.all { display: none; }
  .kpi { padding: 9px 10px; }
  .kpi .num { font-size: 1.55rem; }
  .kpi .lbl { font-size: .64rem; letter-spacing: .03em; }
  .kpi .lbl .long { display: none; }
  .top-actions .btn .txt { display: none; }
  .top-actions .btn { padding: 8px 10px; }
  .search { max-width: none; }
  .toolbar .count { margin-left: 0; }
  /* Phones: search + Filters on one line; the unit, truckmount and sort options open under it */
  .toolbar { flex-wrap: wrap; gap: 8px; }
  .toolbar .search { flex: 1 1 200px; min-width: 0; }
  .toolbar .filt-btn { display: inline-flex; }
  .toolbar:not(.open) > .sortsel, .toolbar:not(.open) > #tmOnly, .toolbar:not(.open) > .count { display: none; }
  .toolbar.open > .sortsel, .toolbar.open > #tmOnly { flex: 1 1 calc(50% - 4px); }
  .toolbar.open > .count { flex-basis: 100%; }
}
@media (prefers-reduced-motion: reduce) { .spin svg { animation: none; } }

/* ---- report menu + printable report ---- */
.report-opts { display: grid; gap: 10px; }
.report-opt { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 40px 1fr; gap: 2px 12px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; background: var(--surface-2); }
.report-opt:hover { border-color: var(--accent); }
.report-opt:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }
.report-opt .ico { grid-row: span 2; width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.report-opt .ico svg { width: 20px; height: 20px; }
.report-opt strong { font-weight: 700; }
.report-opt span.sub { color: var(--muted); font-size: .86rem; }
#printReport { display: none; }
@media print {
  @page { size: landscape; margin: 10mm; }
  body { background: #fff; color: #000; font-size: 10.5pt; }
  body > *:not(#printReport) { display: none !important; }
  #printReport { display: block; }
  #printReport h1 { font-family: var(--font-display); font-size: 20pt; text-transform: uppercase; letter-spacing: .03em; margin: 0 0 2pt; }
  #printReport .pr-sub { color: #444; margin: 0 0 8pt; }
  #printReport .pr-sum { display: flex; gap: 14pt; margin: 0 0 8pt; font-weight: 700; }
  #printReport table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  #printReport th, #printReport td { border-bottom: 1px solid #ccc; padding: 4pt 5pt; text-align: left; vertical-align: top; }
  #printReport th { font-size: 8.5pt; text-transform: uppercase; letter-spacing: .04em; color: #333; border-bottom: 1.5px solid #000; }
  #printReport td.num { text-align: right; }
  #printReport td.nw, #printReport th { white-space: nowrap; }
  #printReport table { font-size: 9.5pt; }
  #printReport .st-due { color: #b42318; font-weight: 700; }
  #printReport .st-soon { color: #8a5300; font-weight: 700; }
  #printReport .st-ok { color: #17803d; font-weight: 700; }
  #printReport tr { break-inside: avoid; }
  #printReport h2 { font-size: 12pt; margin: 12pt 0 4pt; }
  #printReport ul { margin: 0; padding-left: 14pt; }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#16202b"/><path d="M32 9 C38 20 46 28 46 38 a14 14 0 0 1 -28 0 C18 28 26 20 32 9Z" fill="#4078f0"/><path d="M24 40 a8 8 0 0 1 16 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M32 40 L37 34" stroke="#f0b44c" stroke-width="3" stroke-linecap="round"/></svg>
    <h1>VODA Fleet</h1>
  </div>
  <div class="sync" id="syncbar" hidden>

    <button class="icon-btn" type="button" id="refreshBtn" aria-label="Refresh" title="Refresh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg>
    </button>

    </button>
    <button type="button" id="shareReport" hidden>Share report</button>
    <button class="btn primary" type="button" id="addTruck" title="Add truck">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span class="txt">Add truck</span>

</header>

<main class="page">
  <div class="installbar" id="installbar" hidden>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>

<dialog class="drawer" id="drawer" aria-labelledby="drTitle"></dialog>
<dialog id="dlg" aria-labelledby="dlgTitle"></dialog>

<div class="toast" id="toast" role="status" hidden></div>

<script>
"use strict";
// <logic>
const SOON_MILES = 500;   // from the sheet: yellow when under 500 mi left
const SOON_HRS = 20;      // from the sheet: yellow within 20 TM hrs of the next service
const COMBINE_HRS = 20;   // services due within 20 hrs of each other are done together
const DEFAULT_CDS_MILES_PER_HR = 15;

const PROGRAMS = {
  cds: { name: "CDS 4.6 / 4.8", selfPowered: false, tiers: [
    { h: 100, oil: "truck", tasks: [
      "Engine oil – change",
      "Engine air cleaner – inspect",
      "Battery terminals – clean as needed" ] },
    { h: 400, tasks: [
      "Blower oil – change",
      "Pump oil – change",
      "Vehicle fuel lines – check for chafing or wear",
      "CDS wiring harness – check for chafing or wear",
      "Vehicle wiring harness – check for chafing or wear",
      "CDS fasteners – check blower, drive shaft, front end",
      "Drive shaft – grease spline (if so equipped)",
      "Bearings / power pack pillow block – grease",
      "Chemical pump – inspect",
      "Chemical pump diaphragm – check for wear",
      "Chemical pump valves – check for wear",
      "Water box float valve – remove stem and lubricate" ] },
    { h: 1000, tasks: [
      "Vehicle – complete service",
      "Cooling system – flush",
      "Transmission fluid – change",
      "Drive shaft – grease U-joints and splines" ] } ] },
  legend: { name: "Legend GT", selfPowered: true, tiers: [
    { h: 100, tasks: [
      "Vacuum relief valve – check, adjust up to 13″ Hg if needed",
      "O-rings – lubricate (o-ring lubricant only, Legend Brands P/N 13-003)",
      "Belts – check for wear, re-tension, check pulley alignment",
      "Battery terminals – clean",
      "Spark plugs – check (OEM only)",
      "Engine oil and filter – change" ] },
    { h: 500, tasks: [
      "Water pump – change crankcase oil",
      "Engine – replace in-line fuel filter",
      "Pulleys and hubs – check for proper torque",
      "Chemical pump – change diaphragm and check valves, inspect disc",
      "Vacuum pump – grease bearings on pulley end" ] },
    { h: 1000, tasks: [
      "Spark plugs – replace (OEM only)",
      "Engine air filter element – replace" ] },
    { h: 2000, tasks: [
      "All belts – replace",
      "Vacuum pump – drain, flush and replace gear end oil" ] } ] },

    const left = t.oilInterval - used;
    r.oil = { driven, tmHrs, tmMiles, factor, used, left, interval: t.oilInterval, status: stMiles(left) };

  if (prog && isNum(hrs)) {

      const last = lastDone(t, tr, hrs);

    const due = tiers.filter(x => x.dueAt <= soonest + COMBINE_HRS);
    const level = Math.max(...due.map(x => x.h));

    const doNow = tiers.filter(x => due.includes(x) || (x.h < level && level % x.h === 0));

const PALETTE = [["Blue", "#2563eb"], ["Sky", "#0ea5e9"], ["Teal", "#0d9488"], ["Green", "#16a34a"], ["Lime", "#84cc16"], ["Yellow", "#facc15"],

/* ---------- rendering ---------- */
function evalTruck(t) {
  const v = currentValues(t);
  const r = compute(t, safeNum(v.miles), safeNum(v.hrs));
  const pw = paperwork(t, today);
  return { v, r, pw, pwBad: pw.filter(p => p.status !== "ok") };
}
function urgency(r) {
  const parts = [];
  if (r.oil) parts.push(r.oil.left / Math.max(1, r.oil.interval));
  if (r.service) parts.push(r.service.left / 100);
  return parts.length ? Math.min(...parts) : 9;
}
function visibleTrucks() {
  const q = view.q.trim().toLowerCase();
  let list = scoped().map(t => ({ t, e: evalTruck(t) }));
  if (q) list = list.filter(x => [x.t.unit, x.t.driver, x.t.vehicle, x.t.plate, x.t.year, x.t.division, x.t.vin].join(" ").toLowerCase().includes(q));
  if (view.tmOnly) list = list.filter(x => progOf(x.t));
  if (view.filter === "due" || view.filter === "soon" || view.filter === "ok") list = list.filter(x => !x.e.r.empty && x.e.r.worst === view.filter);
  if (view.filter === "paper") list = list.filter(x => x.e.pwBad.length);
  for (const [key, lbl] of PAPER_KPIS) if (view.filter === key) list = list.filter(x => x.e.pw.some(p => p.label === lbl && p.status !== "ok"));
  if (view.filter === "engine") list = list.filter(x => x.t.gps && x.t.gps.check === "on");
  if (view.filter === "tmcheck") list = list.filter(x => checkDue(x.t));
  if (view.sort === "urgent") list.sort(byUrgency);
  return list;
}
/** Most urgent first: the worse of maintenance status and GPS alerts, then how close the next job is. */
const effRank = x => Math.max(RANK[x.e.r.worst] || 0, alertRank(x.t));
const byUrgency = (a, b) => (effRank(b) - effRank(a)) || (RANK[b.e.r.worst] - RANK[a.e.r.worst]) || (urgency(a.e.r) - urgency(b.e.r)) || ((a.t.order ?? 99) - (b.t.order ?? 99));
const gpsOn = () => !!gpsHealth || trucks.some(t => t.gps);

/** The week's TM hrs checklist: shown on Tuesdays, and on other days while any truck was missed. */

  const now = clockNow(), isTue = now.getDay() === CHECK_DAY;
  const left = list.filter(x => x.c.state === "today" || x.c.state === "missed");
  if (!list.length || (!isTue && !left.length)) { box.hidden = true; box.replaceChildren(); return; }
  const done = list.filter(x => x.c.state === "done").length, skipped = list.filter(x => x.c.state === "skipped").length;
  const late = x => x.c.state === "missed" || x.c.weeks >= 1 || !x.c.last;
  const start = list[0].c.start;
  box.hidden = false;
  box.className = "tmcheck " + (!left.length ? "ok" : left.some(late) ? "due" : "soon");
  box.replaceChildren(...[

    for (const j of pendingFor(job.key)) t = Object.assign(overlay(t, j.data.truck), { id: t.id, updatedAt: t.updatedAt });
    const cur = byId(t.id);
    if (cur && String(cur.tmSkip || "") !== String(t.tmSkip || "") && queue.some(j => j.action === "tmSkip" && j.data.id === t.id)) t.tmSkip = cur.tmSkip;
    replaceTruck(t);
    const id = job.data.id, log = job.data.log;
    delete historyCache[id];
    if (openId === id && drawer.open) loadHistory(id);
    if (job.data.truck.color && out.truck.color === undefined) setBanner(SCRIPT_OLD);   // an old script drops the color
    if (log && log.kind === "service") { delete svcCache[id]; if (openId === id && drawer.open) loadServices(id); }
  } else if (job.action === "saveService" && out && out.service) {
    rebase(job.key, out.service.updatedAt);
    const c = svcCache[job.truckId];
    if (c && c.rows) {
      let r = out.service;
      for (const j of pendingFor(job.key)) if (j.action === "saveService") r = Object.assign({}, r, j.data.service, { updatedAt: r.updatedAt, check: "" });
      const gone = pendingFor(job.key).some(j => j.action === "deleteService");
      c.rows = gone ? c.rows.filter(x => x.id !== r.id) : c.rows.some(x => x.id === r.id) ? c.rows.map(x => x.id === r.id ? r : x) : c.rows.concat([r]);
      renderServices(job.truckId);
    }
  } else if (job.action === "deleteService") {

  } else if (job.action === "tmSkip" && out && out.truck) {
    const cur = byId(job.data.id);
    if (cur && !pendingFor(job.key).length) replaceTruck(Object.assign({}, cur, { tmSkip: out.truck.tmSkip || "" }));
    delete historyCache[job.data.id];

  const dropped = pendingFor(job.key);
  if (job.action === "saveTruck") {
    const id = job.data.id;
    if (e.error === "conflict" && e.truck) {
      knownBase[job.key] = e.truck.updatedAt;
      queue = queue.filter(j => j.key !== job.key); saveQueue();   // later changes were based on the old copy too
      replaceTruck(e.truck);
      for (const j of [job].concat(dropped)) if (j.restore) { drafts[id] = j.restore; saveDrafts(); }
      msg = `Someone else just updated ${label(e.truck)}. Your change wasn't saved; the latest numbers are loaded` +
        (job.restore ? " and yours are back in the boxes. Check them and tap Save again." : ". Check them and save again.");
    } else {
      queue = queue.filter(j => j.key !== job.key); saveQueue();
      if (job.restore) { drafts[id] = job.restore; saveDrafts(); }
      msg = e.error === "duplicate_unit" ? `"${e.unit || job.data.truck.unit}" is already used by another truck, so ${job.label} wasn't saved. Pick a different name.`
        : e.error === "gone" ? `${job.label} was deleted on another phone, so the change wasn't saved.`
        : `${job.label}: not saved. ${errText(e, "Nothing")}`;
      refresh(true);
    }
  } else if (job.action === "tmSkip") {
    queue = queue.filter(j => j.key !== job.key); saveQueue();
    msg = e.error === "gone" ? `${job.label} was deleted on another phone.` : `${job.label}: "not available" wasn't saved. ${errText(e, "Nothing")}`;
    refresh(true);
  } else {
    queue = queue.filter(j => j.key !== job.key); saveQueue();
    msg = e.error === "conflict" ? "Someone else just changed that service record, so your change wasn't saved. The latest version is shown."
      : e.error === "gone" ? "That service record was deleted on another phone."
      : `Service record not saved. ${errText(e, "Nothing")}`;
    if (job.truckId) loadServices(job.truckId);
  }
  failNote = msg;
  setBanner(msg);
  toast(msg);
  renderAll();
}
/** Service records: show the change now, send it in the background. New records get their ID here so later edits can follow them. */
function queueService(truckId, rec, okMsg) {
  const c = svcCache[truckId];
  const old = c && c.rows ? c.rows.find(x => x.id === rec.id) : null;
  if (c && c.rows) {
    const local = Object.assign({}, old || {}, rec, { check: "", updatedAt: old ? old.updatedAt : "", source: old ? old.source : "App", by: session ? session.name : "" });
    c.rows = old ? c.rows.map(x => x.id === rec.id ? local : x) : c.rows.concat([local]);
    renderServices(truckId);
  }
  enqueue({ action: "saveService", key: "s:" + rec.id, base: old ? old.updatedAt || "" : "", truckId, data: { service: rec }, okMsg });
}
function queueServiceDelete(truckId, rec, okMsg) {
  const c = svcCache[truckId];
  if (c && c.rows) { c.rows = c.rows.filter(x => x.id !== rec.id); renderServices(truckId); }
  enqueue({ action: "deleteService", key: "s:" + rec.id, base: rec.updatedAt || "", truckId, data: { id: rec.id }, okMsg });
}
const newSvcId = () => "s-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
/** "Not available this week" for the TM hrs check, or undo it. */
function queueTmSkip(id, on) {
  const t = byId(id), c = t && tmCheck(t);
  if (!c) return;
  replaceTruck(Object.assign({}, t, { tmSkip: on ? c.week : "" }));
  enqueue({ action: "tmSkip", key: "k:" + id, data: { id, on, week: c.week }, label: label(t),
    okMsg: on ? `${label(t)}: not available this week` : `${label(t)}: back on this week's TM hrs check` });
  renderAll();
}

/* ---------- saving a reading ---------- */
async function saveReading(id) {
  const t = byId(id); if (!t) return;
  const v = currentValues(t);
  const prog = progOf(t);
  if (Number.isNaN(v.miles) || Number.isNaN(v.hrs) || (isAdmin() && !isNum(v.miles))) return;
  const st = saveState(t, v);
  if (!st.changed && !st.confirm) return;
  const body = plain(t);
  body.milesNow = isAdmin() ? v.miles : t.milesNow;
  if (prog && isNum(v.hrs)) body.hrsNow = v.hrs;
  body.readingAt = new Date().toISOString();
  body.readingBy = session ? session.name : "";
  if (prog && isNum(v.hrs) && (v.hrs !== t.hrsNow || st.confirm)) { body.hrsAt = body.readingAt; body.hrsBy = body.readingBy; }   // counts for the Tuesday check
  const restore = { miles: v.milesStr, hrs: v.hrsStr };
  delete drafts[id]; saveDrafts();
  const log = { kind: "reading", miles: body.milesNow, hrs: prog && isNum(v.hrs) ? v.hrs : null, items: st.confirm ? ["TM hrs confirmed (no change)"] : [] };
  if (st.confirm) log.hrsChecked = true;
  try { saveTruck(t, body, log, st.confirm ? `TM hrs confirmed for ${label(t)}` : `Saved ${label(t)}`, restore); }
  catch (e) { drafts[id] = restore; saveDrafts(); toast(failText(e, "Your numbers")); }
  renderAll();
}

function openService(id) {

  const syncOil = () => {
    const chosen = chosenLevel();

    const covered = servicesCovered(t, chosen, parseNum(val("sv-hrs")));
    const includesOil = prog.tiers.filter(x => covered.includes(x.h)).map(x => x.oil).filter(Boolean);

  const tierRadios = prog ? h("fieldset", null,

      })())))) : null;

  openDialog(
    h("h3", { id: "dlgTitle", text: `Log oil change / service · ${label(t)}` }),

      numField("Miles at service", "sv-miles", isNum(v.miles) ? v.miles : t.milesNow),
      prog ? numField("TM hrs at service", "sv-hrs", isNum(v.hrs) ? v.hrs : t.hrsNow, null, "decimal") : null),
    h("fieldset", null,
      h("legend", { text: "Oil" }),
      h("label", { class: "check" }, truckOil, h("span", null, "Truck oil changed", h("small", { text: `Restarts the ${fmt(t.oilInterval)} mi countdown${t.tm === "cds" ? " (miles and TM hrs)" : ""}` })))),
    tierRadios,
    h("div", { class: "grid2" },
      shopField("sv-shop", ""),
      numField("Cost $ (optional)", "sv-cost", null, null, "decimal")),

          const doOil = truckOil.checked;
          if (!isNum(miles)) { err.textContent = "Enter the miles at service."; return; }
          if (prog && (level || (doOil && t.tm === "cds")) && !isNum(hrs)) { err.textContent = "Enter the TM hrs at service."; return; }
          if (!doOil && !level) { err.textContent = "Tick at least one thing that was done."; return; }
          const cost = parseNum(val("sv-cost").replace(/^\$/, ""));
          if (Number.isNaN(cost)) { err.textContent = "Cost should be a number, like 84.80."; return; }
          const body = plain(t);
          const done = [];
          if (doOil) { body.milesAtOil = miles; if (t.tm === "cds") body.hrsAtOil = hrs; done.push("Truck oil change"); }
          if (level) {
            body.tiers = Object.assign({}, body.tiers || {});

            delete drafts[t.id]; saveDrafts();
            closeDialog();
            renderAll();
          } catch (e) { err.textContent = failText(e, "Nothing"); }
        } }))));
}

/** What an edit changed, for the truck's history: name, plate, unit, driver and color by name, anything else as "Truck details edited". */
function editItems(t, body) {
  const s = v => v == null ? "" : typeof v === "object" ? JSON.stringify(Object.keys(v).sort().map(k => [k, v[k]])) : String(v);
  const was = k => s(t[k]);
  const items = [];
  if (s(body.unit) !== was("unit")) items.push(`Renamed from ${t.unit || "(no name)"} to ${body.unit}`);
  if (s(body.plate) !== was("plate")) items.push(`Plate set to ${body.plate || "(none)"}`);
  if (s(body.division) !== was("division")) items.push(`Unit set to ${body.division || "(none)"}`);
  if (s(body.driver) !== was("driver")) items.push(`Driver changed from ${t.driver || "(none)"} to ${body.driver || "(none)"}`);
  if (s(body.color) !== was("color")) items.push(body.color ? "Color changed" : "Color removed");
  const named = ["unit", "plate", "division", "driver", "color"];
  if (Object.keys(body).some(k => !named.includes(k) && s(body[k]) !== was(k))) items.push("Truck details edited");
  return items;
}

/* ---------- report ---------- */
function buildReport() {
  const d = new Date();
  const lines = [`VODA fleet maintenance · ${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`];
  const groups = { due: [], soon: [], gps: [] };
  const paper = [];
  for (const t of scoped()) {
    const v = currentValues(t);
    const r = compute(t, safeNum(v.miles), safeNum(v.hrs));
    for (const line of issueLines(t, r)) groups[line.kind === "gps" ? "gps" : line.status].push(`• ${label(t)}: ${line.text}`);
    for (const p of paperwork(t, today)) if (p.status !== "ok") paper.push(`• ${label(t)}: ${p.label} ${p.shown}${p.status === "due" ? " (past due)" : ` (in ${p.days} days)`}`);
  }
  lines.push("", "OVERDUE", ...(groups.due.length ? groups.due : ["• none"]));
  lines.push("", "DUE SOON", ...(groups.soon.length ? groups.soon : ["• none"]));
  if (groups.gps.length) lines.push("", "TRUCK ALERTS (GPS)", ...groups.gps);
  if (paper.length) lines.push("", "PAPERWORK", ...paper);
  const chk = checkReport();
  if (chk) lines.push("", chk.title.toUpperCase(), ...(chk.lines.length ? chk.lines.map(x => "• " + x) : ["• nothing missed"]));
  return lines.join("\n");
}

/* ---------- report: download for Excel, print or PDF, share text ---------- */
function reportRows() {
  return scoped().map(t => ({ t, e: evalTruck(t) })).sort(byUrgency);
}
function reportStamp() {
  const d = new Date();
  return { d, iso: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`,
    text: `${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()} ${fmtTime(d)}` };
}
function csvCell(v) {
  const s = v == null ? "" : String(v);
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function buildCsv() {
  const head = ["Name", "Plate", "Unit", "Driver", "Vehicle", "Year", "Status", "Miles now", "Miles saved by", "Oil change every (mi)", "Miles since oil change",
    "Truck oil miles left", "Truckmount", "TM hrs now", "Next TM service", "TM service due at (hrs)", "TM service hrs left",
    "Safety inspection due", "Registration due", "Insurance until", "Paperwork issues", "Last reading",
    "VIN", "Check engine", "Fuel %", "GPS status", "Last GPS report", "Location", "Van engine hrs (reference only)",
    "TM hrs last entered", "TM hrs check this week"];
  const lines = [head];
  for (const { t, e } of reportRows()) {
    const { r, pw } = e;
    const prog = progOf(t);
    const get = lbl => { const p = pw.find(x => x.label === lbl); return p ? p.shown : ""; };
    lines.push([
      t.unit, t.plate, t.division, t.driver, t.vehicle, t.year, r.empty ? "No reading" : statusWord(r.worst),
      isNum(e.v.miles) ? e.v.miles : "", t.readingBy || "",
      t.oilInterval, r.oil ? Math.round(r.oil.used) : "", r.oil ? Math.round(r.oil.left) : "",
      prog ? prog.name : "", prog && isNum(e.v.hrs) ? e.v.hrs : "",
      r.service ? `${r.service.level}-hr` : "", r.service ? r.service.dueAt : "", r.service ? Math.round(r.service.left) : "",
      get("Safety inspection"), get("Registration"), get("Insurance"),
      e.pwBad.map(p => `${p.label} ${p.status === "due" ? "past due" : "due soon"}`).join("; "),
      t.readingAt ? fmtWhen(t.readingAt) : "",
      t.vin || (t.gps ? t.gps.vin : "") || "",
      t.gps ? (t.gps.check === "on" ? "ON" + (t.gps.codes.length ? ": " + t.gps.codes.join(" ") : "") : t.gps.check === "off" ? "Off" : t.gps.check === "none" ? "None reported" : "") : "",
      t.gps && isNum(t.gps.fuel) ? t.gps.fuel : "",
      t.gps ? (t.gps.offline ? "Offline" : t.gps.status) : "",
      t.gps && t.gps.at ? `${fmtWhen(t.gps.at)} ${fmtTime(new Date(t.gps.at))}` : "",
      t.gps ? (t.gps.address || (isNum(t.gps.lat) ? `${t.gps.lat}, ${t.gps.lng}` : "")) : "",
      t.gps && isNum(t.gps.engineHrs) ? t.gps.engineHrs : "",
      t.hrsAt ? `${fmtWhen(t.hrsAt)}${t.hrsBy ? " · " + t.hrsBy : ""}` : "",
      checkWord(tmCheck(t))
    ]);
  }
  return "\ufeff" + lines.map(row => row.map(csvCell).join(",")).join("\r\n");
}
const checkWord = c => !c ? "" : c.state === "done" ? "Done" : c.state === "skipped" ? "Not available" : c.state === "today" ? "Due today" : "Missed";
/** Lines for reports: the week's TM hrs check. */
function checkReport() {
  const chk = scoped().map(t => ({ t, c: tmCheck(t) })).filter(x => x.c);
  if (!chk.length) return null;
  const left = chk.filter(x => x.c.state === "today" || x.c.state === "missed");
  return {
    title: `TM hrs check (Tue ${shortDate(chk[0].c.start)}): ${chk.filter(x => x.c.state === "done").length} of ${chk.length} done`,
    lines: left.map(x => `${label(x.t)}: ${x.c.state === "today" ? "due today" : "missed"} (${x.c.last ? "last entered " + shortDate(x.c.last) : "never entered"})`)
      .concat(chk.filter(x => x.c.state === "skipped").map(x => `${label(x.t)}: not available this week`))
  };
}
function downloadFile(name, text, type) {
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const a = h("a", { href: url, download: name, style: "display:none" });
  document.body.append(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
}

      h("thead", null, h("tr", null, ["Truck", "Status", "Miles now", "Truck oil", "TM hrs", "Next TM service", "Paperwork", "Last reading"].map(x => h("th", { text: x })))),
      h("tbody", null, rows.map(({ t, e }) => {
        const { r } = e;
        const prog = progOf(t);
        return h("tr", null,
          h("td", null, h("strong", { text: t.unit || "Truck" }), t.plate ? ` · ${t.plate}` : "",
            h("div", { text: [t.division, t.driver, prog ? prog.name : ""].filter(Boolean).join(" · ") })),
          h("td", { class: "nw st-" + (r.empty ? "" : r.worst) }, r.empty ? "No reading" : statusWord(r.worst),
            gpsAlerts(t).map(a => h("div", { class: "st-" + a.status, text: a.short }))),
          td(isNum(e.v.miles) ? fmt(e.v.miles) : "", "num nw"),
          td(r.oil ? oilText(r.oil) : "", "nw"),
          td(prog && isNum(e.v.hrs) ? fmt(e.v.hrs) : "", "num nw"),
          td(r.service ? `${serviceText(r.service)} (at ${fmt(r.service.dueAt)})` : ""),
          td(e.pwBad.map(p => `${p.label} ${p.status === "due" ? "past due" : "soon"}`).join(", ")),
          td(t.readingAt ? `${fmtWhen(t.readingAt)}${t.readingBy ? " · " + t.readingBy : ""}` : ""));
      }))),
    h("h2", { text: "Needs attention" }),
    issues.length ? h("ul", null, issues.map(x => h("li", { text: x }))) : h("p", { text: "Nothing due on oil or TM service." }),
    paper.length ? h("h2", { text: "Paperwork" }) : null,
    paper.length ? h("ul", null, paper.map(x => h("li", { text: x }))) : null,
    ...(() => { const c = checkReport(); return c ? [h("h2", { text: c.title }), c.lines.length ? h("ul", null, c.lines.map(x => h("li", { text: x }))) : h("p", { text: "Nothing missed." })] : []; })()].filter(Boolean));
}
function printReport() {
  buildPrintReport();
  closeDialog();
  setTimeout(() => {
    try { window.print(); }
    catch (e) { toast("Printing isn't available here. Use Download for Excel instead."); }
  }, 60);
}
const ICONS = {
  csv: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>',
  pdf: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/></svg>',
  share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v14"/></svg>'
};
function reportOpt(icon, title, sub, onclick, id) {
  const ico = h("span", { class: "ico" });
  ico.innerHTML = ICONS[icon];
  return h("button", { class: "report-opt", type: "button", id, onclick }, ico, h("strong", { text: title }), h("span", { class: "sub", text: sub }));
}
function openReportMenu() {
  openDialog(
    h("h3", { id: "dlgTitle", text: "Fleet report" }),
    h("p", { text: `${view.division ? view.division + ": " : "All "}${scoped().length} trucks, most urgent first, with the numbers on screen right now.` }),
    h("div", { class: "report-opts" },
      reportOpt("csv", "Download for Excel (CSV)", "Every truck with miles, oil, TM service and paperwork. Opens in Excel or Google Sheets.", () => { downloadCsv(); closeDialog(); }, "rep-csv"),
      reportOpt("pdf", "Print or save as PDF", "A one-page fleet table. Choose Save as PDF in the print window.", printReport, "rep-pdf"),
      reportOpt("share", "Share or copy as text", "A short list of what's overdue and due soon, for a text or email.", () => { closeDialog(); $("shareReport").click(); }, "rep-share")),
    h("div", { class: "dlg-foot" }, h("div", { class: "right" }, h("button", { class: "btn", type: "button", onclick: closeDialog, text: "Close" }))));
}
$("reportBtn").addEventListener("click", openReportMenu);

/* ---------- install as an app ---------- */
const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
let installEvt = null;
function renderInstall() {
  const bar = $("installbar");
  if (isStandalone() || store.get(K_INSTALL)) { bar.hidden = true; return; }
  if (installEvt) {
    $("installText").textContent = "Install VODA Fleet on this phone so it opens like an app.";
    $("installBtn").hidden = false; bar.hidden = false;
  } else if (isIOS) {
    $("installText").textContent = "To install on iPhone: tap the Share button (square with an arrow), then Add to Home Screen.";
    $("installBtn").hidden = true; $("installDismiss").textContent = "Got it"; bar.hidden = false;
  } else bar.hidden = true;
}
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; renderInstall(); });
window.addEventListener("appinstalled", () => { installEvt = null; $("installbar").hidden = true; toast("VODA Fleet installed. Open it from your home screen."); });
$("installBtn").addEventListener("click", async () => {
  if (!installEvt) return;
  installEvt.prompt();
  try { await installEvt.userChoice; } catch (e) {}
  installEvt = null; renderInstall();
});
$("installDismiss").addEventListener("click", () => { store.set(K_INSTALL, true); $("installbar").hidden = true; });

/* ---------- start ---------- */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && session && CONFIGURED) refresh(true); });
window.addEventListener("online", () => { if (session && CONFIGURED) { refresh(true); pump(); } });
setInterval(() => { if (document.visibilityState === "visible" && session && CONFIGURED && !dlg.open) refresh(true); }, 90000);

renderInstall();
if (!CONFIGURED) showNotConfigured();
else if (!session) showSignIn("");
else {
  const cache = store.get(K_CACHE);
  if (cache && Array.isArray(cache.trucks)) { trucks = sortTrucks(cache.trucks); lastSync = new Date(cache.at); loaded = true; }
  startApp();
}

</script>
</body>
